<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a16">
<title>큐브관 살인사건 전말</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#060a16; --mist:#8d9bbb; --star:#eef1f8; --firefly:#d8c53f; --line:rgba(238,241,248,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{height:100%;margin:0;background:var(--night);color:var(--star);overflow:hidden;
  font-family:"Nanum Myeongjo","Noto Serif KR",serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

.stage{position:fixed;inset:0;overflow:hidden}
.art{position:absolute;inset:-2%;background:url("bg.jpg") center/cover no-repeat;
  filter:saturate(.85) brightness(.55);transform:scale(1.02);transition:filter 2.4s ease}
.stage.dim .art{filter:saturate(.6) brightness(.3)}
.veil{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 58%,rgba(6,10,22,0) 0%,rgba(6,10,22,.55) 55%,rgba(6,10,22,.92) 100%),
             linear-gradient(180deg,rgba(6,10,22,.65) 0%,rgba(6,10,22,0) 28%,rgba(6,10,22,0) 55%,rgba(6,10,22,.9) 100%)}
canvas#flies{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 3.2vh);left:4vw;pointer-events:none;
  font-weight:800;color:var(--firefly);letter-spacing:.04em;font-size:clamp(14px,1.9vw,26px);line-height:1.25;opacity:.92}
.brand small{display:block;font-weight:400;color:var(--mist);font-size:.48em;letter-spacing:.38em;margin-top:.5em}

.title-wrap{position:absolute;left:6vw;right:6vw;bottom:15vh;text-align:center;pointer-events:none}
.scene-num{font-weight:700;color:var(--firefly);font-size:clamp(18px,2.6vw,38px);letter-spacing:.3em;text-indent:.3em;
  margin-bottom:1.4vh;min-height:1.2em}
.scene-title{font-weight:800;font-size:clamp(34px,6.2vw,92px);line-height:1.18;text-shadow:0 2px 30px rgba(0,0,0,.6);word-break:keep-all}
.scene-sub{margin-top:2.2vh;color:var(--mist);font-size:clamp(13px,1.55vw,22px);letter-spacing:.08em;min-height:1.4em}
.title-wrap .t{transition:opacity 1.1s ease,transform 1.1s ease}
.title-wrap.out .t{opacity:0;transform:translateY(8px)}

/* 화면 반쪽씩: 왼쪽 이전, 오른쪽 다음 */
.zone{position:absolute;top:0;bottom:0;width:50%;border:0;padding:0;margin:0;background:transparent;cursor:pointer}
.zone.prev{left:0}.zone.next{right:0}
.zone:focus-visible{outline:2px solid var(--firefly);outline-offset:-6px}
.zone .hint{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;
  display:grid;place-items:center;color:var(--star);background:rgba(6,10,22,.4);opacity:0;transition:opacity .5s}
.zone.prev .hint{left:2.4vw}.zone.next .hint{right:2.4vw}
.zone.flash .hint{opacity:.85;transition:none}
.zone .hint svg{width:22px;height:22px}


.full{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);
  width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(6,10,22,.35);color:var(--mist);
  display:grid;place-items:center;opacity:.45;cursor:pointer;z-index:5}
.full:focus-visible{outline:2px solid var(--firefly);outline-offset:2px;opacity:1}
.full svg{width:18px;height:18px}

.start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;
  padding:14px 22px;border-radius:14px;border:1px solid var(--line);background:rgba(6,10,22,.55);
  color:var(--star);font-size:clamp(15px,1.7vw,22px);letter-spacing:.06em;transition:opacity .6s}
.start.gone{opacity:0}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translateX(-50%);z-index:6;
  padding:10px 16px;border-radius:10px;background:rgba(8,13,28,.92);border:1px solid var(--line);font-size:14px;
  opacity:0;transition:opacity .3s;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1}
.newsart{position:absolute;inset:0;background:url("news.jpg") center/cover no-repeat;opacity:0;transition:opacity 1.6s ease}
.brand,.title-wrap,canvas#flies{transition:opacity 1.2s ease}
.stage.news .newsart{opacity:1}
.stage.news .brand,.stage.news .title-wrap,.stage.news canvas#flies,.stage.news .veil{opacity:0}
.newsui{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease .4s}
.stage.news .newsui{opacity:1}
.bug{position:absolute;top:calc(env(safe-area-inset-top,0px) + 3.4vh);left:3.2vw;display:flex;align-items:center;gap:.8vw}
.bug .mark{width:clamp(10px,1vw,16px);height:clamp(10px,1vw,16px);background:var(--firefly)}
.bug .ch{font-weight:800;font-size:clamp(14px,1.7vw,24px);letter-spacing:.06em}
.bug .dt{color:var(--mist);font-size:clamp(12px,1.25vw,18px);letter-spacing:.1em;margin-left:.4vw}
.lower{position:absolute;left:3.2vw;right:3.2vw;bottom:calc(env(safe-area-inset-bottom,0px) + 10.5vh);
  display:flex;align-items:stretch;background:rgba(6,10,22,.86);border-top:2px solid var(--firefly);
  box-shadow:0 10px 40px rgba(0,0,0,.45)}
.lower .tag{flex:0 0 auto;display:grid;place-items:center;padding:0 1.6vw;background:var(--firefly);color:#15130a;
  font-weight:800;font-size:clamp(14px,1.8vw,26px);letter-spacing:.12em}
.lower .hl{flex:1;min-width:0;padding:1.6vh 2vw;font-weight:800;font-size:clamp(20px,3.1vw,46px);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .45s ease,transform .45s ease}
.lower .hl.swap{opacity:0;transform:translateY(10px)}
.cap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 27vh);
  width:min(84vw,1200px);text-align:center;font-weight:700;font-size:clamp(16px,2.15vw,32px);line-height:1.5;word-break:keep-all;
  padding:.5em 1em;background:rgba(6,10,22,.72);text-wrap:balance;border-radius:6px;text-shadow:0 1px 3px rgba(0,0,0,.6);
  transition:opacity .35s ease}
.cap.off{opacity:0}
.ticker{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 3.6vh);height:clamp(30px,5.2vh,52px);
  display:flex;align-items:center;background:rgba(15,26,51,.94);overflow:hidden}
.ticker .lab{flex:0 0 auto;height:100%;display:grid;place-items:center;padding:0 1.4vw;background:#1c2a4f;
  color:var(--firefly);font-weight:700;font-size:clamp(12px,1.4vw,20px);letter-spacing:.08em;z-index:1}
.ticker .run{display:flex;white-space:nowrap;will-change:transform;animation:run 70s linear infinite}
.ticker .run span{font-size:clamp(13px,1.55vw,22px);padding-right:3vw;color:var(--star)}
.ticker .run span::before{content:"";display:inline-block;width:.45em;height:.45em;background:var(--firefly);margin:0 1.1vw 0 0;vertical-align:.15em}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ans{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .9s ease;
  background:radial-gradient(ellipse at 50% 40%,rgba(10,15,32,.86),rgba(6,10,22,.97));
  padding:calc(env(safe-area-inset-top,0px) + 4.2vh) 4vw calc(env(safe-area-inset-bottom,0px) + 4vh);display:flex;flex-direction:column}
.stage.answer .ans{opacity:1}
.stage.answer .title-wrap,.stage.answer .brand{opacity:0}
.ans .hd{display:flex;align-items:baseline;gap:1.2vw;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:1.6vh}
.ans .badge{font-weight:800;font-size:clamp(14px,1.6vw,24px);padding:.25em .7em;border-radius:4px;color:#14130a;background:var(--acc)}
.ans .rd{color:var(--acc);font-weight:700;font-size:clamp(13px,1.4vw,20px);letter-spacing:.08em}
.ans .ct{font-weight:800;font-size:clamp(20px,2.7vw,40px)}
.ans .bd{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:3vw;padding-top:2.6vh}
.ans .fig{min-height:0;display:flex;align-items:center;justify-content:center}
.ans .fig svg{width:100%;height:100%;max-height:100%}
.ans .tx{min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.ans .q{color:var(--acc);font-weight:800;line-height:1.45;margin-bottom:.9em;word-break:keep-all}
.ans .a{line-height:1.75;word-break:keep-all;color:var(--star)}
.sync{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 9vh);transform:translateX(-50%);z-index:7;
  width:min(86vw,980px);padding:16px 20px;border-radius:12px;background:rgba(8,13,28,.94);border:1px solid var(--firefly);
  font-size:clamp(14px,1.6vw,20px);line-height:1.6;pointer-events:none}
.sync b{color:var(--firefly)}
.sync textarea{width:100%;height:30vh;margin-top:10px;background:#0b1224;color:var(--star);border:1px solid var(--line);
  border-radius:8px;font:13px/1.5 monospace;padding:8px;pointer-events:auto}
.sync .row{display:flex;gap:10px;margin-top:10px;pointer-events:auto}
.sync button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:rgba(238,241,248,.08);font-weight:700}
@media (prefers-reduced-motion: reduce){ .title-wrap .t,.art{transition:none} .ticker .run{animation-duration:140s} }
</style>
</head>

<div class="stage" id="stage">
  <div class="art"></div>

  <canvas id="flies"></canvas>
  <div class="veil"></div>
  <div class="brand">큐브관 살인사건 전말<small>MURDER IN THE CUBE</small></div>
  <div class="title-wrap" id="titleWrap">
    <div class="t scene-num" id="sceneNum"></div>
    <div class="t scene-title" id="sceneTitle">큐브관 살인사건 전말</div>
    <div class="t scene-sub" id="sceneSub"></div>
  </div>

  <div class="newsui" aria-hidden="true">
    <div class="bug"><span class="mark"></span><span class="ch">저녁 뉴스</span><span class="dt">2030. 8. 21</span></div>
    <div class="cap off" id="nCap"></div>
    <div class="lower"><div class="tag" id="nTag">뉴스</div><div class="hl" id="nHl">2030년 8월 21일 저녁 뉴스</div></div>
    <div class="ticker"><div class="lab">주요 뉴스</div><div class="run" id="nRun"></div></div>
  </div>

  <button class="zone prev" id="zPrev" aria-label="이전 장면">
    <span class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></span>
  </button>
  <button class="zone next" id="zNext" aria-label="다음 장면">
    <span class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></span>
  </button>

  <button class="full" id="bFull" aria-label="전체 화면">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <div class="start" id="start">화면을 눌러 시작</div>
  <div class="ans" id="ans" aria-live="polite">
    <div class="hd"><span class="badge" id="aBadge"></span><span class="rd" id="aRound"></span><span class="ct" id="aTitle"></span></div>
    <div class="bd"><div class="fig" id="aFig"></div><div class="tx" id="aTx"><div class="q" id="aQ"></div><div class="a" id="aA"></div></div></div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="sync" id="sync" hidden></div>
</div>

const ANSWERS = {"A1": [[null, "범인은 미리 쪽지를 남겨두고, 밤중에 김유진의 방을 201에서 꼭대기 층 304로 옮겼다. 김유진이 새벽 2시에 약속 장소로 가려고 문을 여는 걸 이용해, 문을 열자마자 꼭대기 층에서 떨어지게 만들었다. 큐브관 방문은 바깥으로 밀어 여는 구조라 밀면서 자연스럽게 발이 앞으로 나간다. 복도의 검은 유리도 바깥의 밤도 새까매서 분간이 안 되고, 방 안의 수면 유도 기체까지 더해져 새벽 2시의 김유진은 잠에 취해 있었다. 게다가 첫 번째 사망자라 그전에 아무 일도 없었으니 경계할 이유가 없었고, 아무 대비 없이 문을 열어 떨어졌다. 죽은 뒤 범인은 옥상으로 가서 문을 닫고 방을 원래대로 돌려놨다."]], "A2": [["한도경의 밀실은 어떻게 만들었을까?", "저녁을 먹는 동안 김세영이 자기 방과 한도경의 방을 바꿨다. 둘은 같이 1층으로 내려와 문 앞에서 잠금을 풀려 했는데, 그때 방은 이미 서로 바뀐 상태였다. 세영이 잘 자라고 인사했고, 서로 인사를 주고받는 대화로 각자의 문이 열린 셈이 됐다. 큐브관은 복도에서 평범하게 말해도 복도 전체에 또렷이 들리게 설계돼 있어서 소리칠 필요도 없다. 한도경이 세영의 방에 들어가 문을 잠갔는데, 잠그는 건 누구 목소리로도 되기 때문이다. 그래서 세영은 언제든 다시 열고 들어갈 수 있었다. 실제로는 세영이 들어가 독을 묻힌 작은 나이프로 한도경을 죽였다. 작은 나이프만으로는 사람을 죽일 수 없으니 독이 필요했다. 그다음 시신을 한도경의 방으로 옮기고 방을 제자리로 돌린 뒤 잠가서 밀실처럼 보이게 했다. 밤 10시 창문 두드리는 시간이 되자, 세영은 방을 먼저 101 자리로 옮겨 자기 창문을 두드려 한도경 쪽에서 나는 소리처럼 꾸미고, 다시 103으로 돌려 두 번째로 두드렸다. 원격 조작이 즉시 이뤄지는 설정이라 5초 안에 충분히 된다. 이 수법으로 범인이 김세영임이 확정된다."], ["한도경 방의 노크 소리는 어떻게 꾸몄을까?", "원격으로 자기 방을 101 자리로 옮겨 두드린 뒤 제자리로 돌려 다시 두드렸다. 밀실이 풀리면 범인이 김세영임이 나오고, 세영은 한도경 바로 다음 순서로 두드리는 사람인데, 원격 조작이 \"즉시\"라 5초면 된다."]], "A3": [["다인은 밥을 먹고 방에 돌아와 문을 잠그고 잤다. 범인은 어떻게 문을 열었을까?", "다들 식당에 있는 동안 범인이 다인의 방과 자기 방을 바꿨다. 범인은 김세영이다. 다인이 들어간 건 세영의 방이었고, 거기서 문을 잠그고 잤다. 세영의 방엔 약이 있었다. 세영이 중간에 문을 두드린 건 다인이 약에 취했는지 확인하려던 것이다. 아직 깨어 있으면 들어가지 않는다. 약이 돌기를 기다렸다가 잠금을 풀고 들어갔다."], ["사방이 열리지 않는 방에서 다인은 어떻게 물에 빠져 죽었을까?", "범인은 화장실 물을 틀어놓고 흘려보냈다. 물 쓴 양이 이상하니 다들 화장실 물에 매달리게 되고, 실제로 다인을 죽인 물 — 빗물 — 은 가려진다. 전날 밤새 큰비가 왔다. 범인은 먼저 김유진 방의 카펫을 걷어 유진의 방문 밖 복도에, 원래 있던 카펫 위에 겹쳐 깔았다. 아무도 지나가지 않는 자리라 조금 높아진 걸 눈치채지 못한다. 그다음 유진의 방을 식당 자리, 즉 꼭대기 층으로 옮겨 문이 위를 보게 하고, 옥상에 올라가 문을 열어 밤새 비를 받았다. 날이 밝으면 되돌리는데, 다들 식당에 밥 먹으러 가기 때문이다. 되돌린 뒤에도 문은 위를 향해야 물이 문을 밀어내지 않는다. 밥을 먹은 뒤 문태오와 김미래 시점에 머리가 아프고 몽롱하다는 게 나오는데, 사실 약을 탄 것이다. 세영은 낮잠 시간에 다들 뻗은 틈에 움직였다. 물을 채운 유진의 방을 문태오의 방 자리로 옮기고, 다인 방의 문을 위로 돌린 뒤, 호스와 펌프를 들고 옥상에 올라가 두 문을 열고 유진 방의 물을 세영 방으로 퍼 넣어 다인을 빠뜨렸다. 방 깊이가 4미터, 방 사이가 4미터니 8미터짜리 호스면 바닥의 물까지 닿는다. 다인이 죽은 뒤 물을 유진의 방으로 되퍼 옮기고, 문을 닫고 방을 제자리로 돌린 다음, 시신과 젖은 카펫을 다인의 방으로 옮기고 다인 방의 마른 카펫을 세영의 방에 깔았다. 물이 가득한 유진의 방은 201 자리로 되돌렸는데, 문이 북쪽을 보게 되니 물의 압력이 잠기지 않은 문을 밀어 열어 물이 전부 바깥으로 빠진다. 북쪽엔 한도경뿐인데 이미 죽었으니 아무도 못 본다. 바깥 소리는 안에서 안 들리니 물소리도 안 들린다. 마지막으로 유진 방의 마른 카펫을 되돌려 놓았다."]], "A4": [["미래는 왜 세영을 찾아가다 창고에 들어갔고, 세영은 왜 미래를 찾다 다인의 시신을 봤을까?", "김세영이 창고와 방을 바꿨고, 미래는 304 다인의 방에서 깨어났다. 다인의 방에서 세영을 찾아가려면 두 층 아래 03호실로 가야 하는데, 세영이 창고와 바꿔놨으니 창고로 들어가게 된다. 세영이 미래를 찾으려면 한 층 위 04호실로 가야 하는데, 세영은 203으로 옮겨져 있었으니 304로 가게 되고 거기서 다인의 시신을 본다."], ["미래는 왜 사방이 열리지 않는 방에 있었고, 두 면의 유리 밖에 반딧불이가 보였을까?", "미래는 204, 자기 방에서 죽었다. 문이 아래를 보도록 돌렸는데 아래는 화장실 천장이라 열리지 않는다. 그다음 한도경의 방을 304로 옮기고 문이 아래를 보게 했다. 한도경 방은 문이 없으니, 미래 방에서 위를 보는 매직미러를 지나 한도경 방문 맞은편 매직미러를 통해 꼭대기 층 바깥의 반딧불이가 보인다. 카펫은 방 오른쪽 벽, 원래의 바닥에 있다. 미래에게는 두 면의 창이 자기 주위 네 면 중 둘에 있는 셈이다. 다만 문제가 하나 남는다. 한쪽 창밖 반딧불이는 보통 거리인데 다른 쪽은 4미터 밖이다. 어떻게 눈치 못 채게 했을까. 창고에 잠자리채가 있다. 범인은 반딧불이 몇 마리를 잡아 한도경 방에 넣어 거리감을 맞췄다."]], "B1": [[null, "중력 카펫을 2층 복도 남쪽 벽에 붙인다. 김유진이 새벽에 문을 열고 나가면 복도 쪽 중력에 끌려 복도 길이만큼 옆으로 떨어져 죽는다. 방 위치상 8미터가 넘으니 7미터 조건을 만족한다. 그럼 복도에 떨어진 피는 어떻게 처리했을까. 유리에 묻은 피는 닦기 쉽지만 카펫에 스미면 지우기 어렵다. 그래서 범인은 물이 안 스미는 면, 즉 카펫 뒷면을 쓴다. 먼저 복도의 카펫을 다 걷고 한 장을 벽에 붙여 중력장을 만든다. 나머지는 뒤집어 그 위에 올려두는데, 평평하게 깔면 효과가 나버리니 벽 모서리에 구부려 세워둔다. 그것들이 효과를 내는 카펫을 덮어 보호한다. 범인은 창고의 카트로 시신을 1층 동쪽 바닥으로 옮겨 옥상에서 떨어진 것처럼 꾸몄다. 단서에 전날 밤 모래바람이 한 차례 불어 핏자국이 덮이고 망가졌다고 나온다. 그래서 시신 주변 흔적으로는 아무것도 알 수 없고, 그 자리가 처음 현장이 아닐 수도 있다는 뜻이 된다."]], "B2": [["한도경의 밀실은 어떻게 만들었을까?", "한도경 시점의 \"저녁 시간, 나는 먼저 화장실에 한 번 다녀왔다. 그러고 식당으로 가던 길에 문득 방문을 안 잠근 게 생각나서, 돌아가 문을 잠그고 나서야 식당에 갔다.\"는 대목에서, 범인이 방에 들어가 뭔가를 설치할 시간이 있었음을 알 수 있다. 범인은 조명 아래 카펫 한 귀퉁이를 접어 나이프로 눌러두고, 독을 묻힌 양철 조각을 위로 던졌다. 양철은 천장에 닿으면 멈춰 위에 붙어 있는다. 한도경이 돌아와 문을 잠근 뒤 구석 조명 아래 은빛으로 번쩍이는 나이프를 보고 집어 들자, 카펫이 탄성으로 펴지면서 날카로운 조각들이 4미터 위에서 쏟아져 그를 베었다."], ["한도경 방의 노크 소리는 어떻게 꾸몄을까?", "밖에서 두드렸다. 이 수법으로 범인이 김세영임이 확정된다. 세영과 한도경 둘 다 1층이고, 세영은 큐브관 밖으로 나가 바깥에서 창을 두드렸다. 밖에서 보면 두 사람의 유리는 4미터 거리라 5초면 충분히 간다."]], "B3": [["다인은 밥을 먹고 방에 돌아와 문을 잠그고 잤다. 범인은 어떻게 문을 열었을까?", "다인이 방에 돌아왔을 때 이미 안에 사람이 있었다. 증언 2를 보면 두 딸 중 하나가 앞을 못 본다. 시점을 맞춰보면 미래는 분명히 볼 수 있다. 그런데 다인의 시점에는 제 눈으로 본 장면이 하나도 없다. 그러니 앞을 못 보는 쪽은 박다인이다. 다인은 식당에 가면서 문을 잠그지 않았고, \"마지막으로 다 먹고 식당을 나온\" 사람이었다. 그러니 범인은 식당을 나온 뒤 다인의 방에 들어갔다. 다인이 돌아와 문을 잠그고 잔 뒤, 범인은 카펫 이야기를 물어 다인이 대답하게 했다. 그때 범인은 문 안쪽에서 문을 누르고 있었다. 다인이 대답하는 순간 잠금이 풀렸고, 다인은 계속 잤지만 문은 이미 열려 있었다. 누가 우연히 문을 두드려주기를 기대할 수는 없으니, 두드린 사람이 곧 범인이다. 김세영이다. 그런데 다인이 들은 건 \"문 밖에서 【……"], ["사방이 열리지 않는 방에서 다인은 어떻게 물에 빠져 죽었을까?", "범인은 다인을 재운 뒤 1층으로 데려가, 중력 카펫을 1층 복도 서쪽 벽에 붙이고 그 공간에서 화장실 물로 빠뜨렸다. 중력장은 카펫에서 수직으로 나노 자성 유리까지라, 복도 전체의 가로 구역이 된다. 호스가 그 구역 어디든 닿기만 하면 물은 서쪽으로 떨어진다. 길이도 충분하다. 다인이 못 연 네 면은 바닥, 천장, 한도경 쪽 벽, 세영의 문이다."]], "B4": [["미래는 왜 세영을 찾아가다 창고에 들어갔고, 세영은 왜 미래를 찾다 다인의 시신을 봤을까?", "다인의 시신은 204, 미래의 방에 있다. 미래는 204에서 깨어나 다인의 방인 줄 알고 두 층 아래 03호실로 가려 했다. 202 전송실에서 아래 버튼을 한 번 눌러 102에 도착했는데, 범인이 미리 102 전송실 카펫을 천장에 붙여뒀다. 미래는 천장에 서게 되어 위아래 화살표가 뒤집힌다(1층에도 아래 버튼이 있지만 원래 작동하지 않는다). 그래서 한 번 더 아래를 눌렀는데 실은 위였고, 다시 202로 돌아왔다. 나와서 03호실로 가니 창고였다. 세영은 자리가 안 바뀌었으니 103에서 204로 올라갔고 거기서 다인의 시신을 봤다."], ["미래는 왜 사방이 열리지 않는 방에 있었고, 두 면의 유리 밖에 반딧불이가 보였을까?", "미래는 304, 다인의 방에 있었다. 꼭대기 층 방은 매직미러가 세 면인데, 범인이 카펫을 304 동쪽 벽에 붙여 한 면을 가렸다. 미래에게는 카펫이 바닥이 되니, 그 위에 선 미래 주위로 남쪽 유리와 천장 유리 두 면이 남는다. 방문은 미래의 천장이 되어, 잠기지 않았어도 손이 닿지 않아 열 수 없었다."]], "C1": [[null, "김유진을 재워서 301에 눕혀둔다. 유진 시점에 잘 때 문을 안 잠갔고 그 뒤 문을 열고 약속에 나갔다고 했으니, 4층으로 올라가게 된다. 범인은 미리 4층 전송실과 복도 카펫을 천장에 붙여뒀다. 유진이 올라오면 위아래가 뒤집혀 있으니, 다인 방의 북쪽 유리벽을 두드리게 된다. 유진에겐 그게 01호실 문으로 보이기 때문이다. 범인이 미리 다인을 재워뒀으니 다인은 열지 않는다. 꼭대기 층엔 다인뿐이라 다른 사람도 못 듣는다. 문전박대당한 유진은 자기 방으로 내려가려는데, 4층 전송실이 뒤집혀 있으니 아래인 줄 알고 누른 게 위였고 옥상으로 올라간다. 범인은 옥상에서 기다리다가 올라온 유진을 밀었다."]], "C2": [[null, "범인은 약으로 한도경을 방에서 재웠다. 사람들이 문을 부수고 들어간 뒤, 독을 묻힌 작은 나이프로 한 번 그었다. 수법이 아주 간결하다. 내용을 보면 범인은 문태오로 특정된다. 문을 부순 뒤 \"태오 씨가 다가가 맥을 짚어보니\"고 나온다. 그 틈에 태오는 소매에 숨겨둔 나이프로 피부를 긋고 시신 옆에 놓았다. 나중에 태오를 구할 때 밧줄로 \"긴 소매 소맷부리를 묶여 있었다\"고 나오니 긴 소매를 입고 있었고 칼을 숨길 수 있었다. 현장은 \"어둑한 조명\"고 묘사되고, 한도경은 남동쪽 구석에 쓰러져 있었으니 태오가 다가가 쭈그리면 반드시 등을 지게 된다. 유리 조각이 몸에 상처를 많이 냈으니 나이프 자국은 묻힌다. 동시에 태오가 묶여 있던 것도 풀린다. 태오가 범인이면 그건 자작극이다. 그날 밤 조명에서 향이 안 났다는 대목이 있는데, 다른 날은 늘 향이 났다. 그 향에 약이 들어 있다. 매일 밤 다들 깊이 잠들었기에 한 명씩 죽을 수 있었던 것이다. 그런데 그날만은 재우면 안 됐다. 납치극으로 다들 깨워 모아야 했으니까. 그래야 한도경이 없어진 걸 알아채고, 태오가 큐브 두 면을 맞춰 놓아 방 안에서 이미 죽었다고 믿게 만들어 문을 부수게 되고, 제일 먼저 다가가 수법을 끝낼 수 있다. 다음 날 아침까지 기다리면 한도경의 약도 깬다. 이제 한도경은 10시 전에 죽은 게 아니니, 창문 두드리는 소리는 본인이 두드린 것이다."]], "C3": [["다인은 밥을 먹고 방에 돌아와 문을 잠그고 잤다. 범인은 어떻게 문을 열었을까?", "이 수법은 안 뒤집힌다. 다인은 여전히 앞을 못 보고, 두드린 사람은 방 안에 숨어 있을 수 있다. 다만 사람이 바뀐다. 두드린 사람이 \"거기 카펫 남는 거 있어요? 저희 층에 한 장이 모자라서요.\"라고 했고 다인이 \"없어요. 미래 있는 층에 가 보세요.\"라고 답했다. 이제 세영과 미래가 같은 층이니 두드린 사람은 태오다. 두드린 사람이 범인이라는 논리에 따라 이 사건의 범인은 문태오다."], ["사방이 열리지 않는 방에서 다인은 어떻게 물에 빠져 죽었을까?", "1층 문들을 전부 180도로 열면 가운데 방 하나 크기의 공간이 생긴다. 다인을 그 안에 가둔다. 문은 180도까지만 열리니 사방을 더 밀 수 없다. 물은 문태오 방문의 구멍으로 붓는다. 이야기 카드에 구멍이 태오 방문 오른쪽 아래 모서리에 있다고 나오니, 180도로 열면 구멍이 화장실 문 앞에 온다. 범인은 호스를 수도꼭지에 연결해 구멍으로 붓는다. 다만 구멍이 아래쪽이라 부으면서 새니, 먼저 가운데 구역 카펫을 천장에 올리고 다인을 복도 한가운데 천장 위에 둔다. 그러면 물이 천장 쪽으로 흐른다. 다인이 죽으면 호스를 펌프에 연결해 화장실로 퍼내 흘려보낸다. 시신과 젖은 카펫은 다인의 방으로 되돌린다. 이번에도 젖는 건 카펫 한 장뿐이다."]], "C4": [["미래는 왜 세영을 찾아가다 창고에 들어갔고, 세영은 왜 미래를 찾다 다인의 시신을 봤을까?", "다인의 시신은 304, 미래의 방에 있다. 미래는 304에서 깨어나 다인의 방인 줄 알고 세영을 찾아가려 했다. 이제 한 층만 내려가 03호실로 가면 되는데, 그게 203 창고다. 세영이 미래를 찾으러 가면 미래 방에서 다인의 시신을 본다."], ["미래는 왜 사방이 열리지 않는 방에 있었고, 두 면의 유리 밖에 반딧불이가 보였을까?", "미래는 빈방에서 죽었다. 문이 안 열린 건 범인이 자기 목소리를 그 방에 등록해 잠갔기 때문이다. 1막에 \"모든 방의 잠금은 초기화 상태고, 각자 자기 방에 자기 목소리를 등록했다\"고 나온다. 사람이 안 사는 빈방은 여전히 초기화 상태라 등록할 수 있다는 뜻이다. 또 \"한 방에는 한 사람의 목소리만 등록된다\"고 하는데, 이건 한 사람의 목소리가 한 방에만 등록된다는 뜻이 아니다. 그러니 범인은 빈방 하나에 자기 목소리를 더 등록하면 된다. 큐브관의 빈방 셋 다 쓸 수 있다. 204와 301은 같고, 403이라면 창이 세 면이라 한 단계 더 필요하다. 카펫을 천장에 놓거나 옥상에서 천창을 덮어야 한다."]]};
/* ---------- 해답 그림 (원본 해답 카드 그림을 한국어로 다시 그림) ---------- */
const DG = (function(){
  const L='rgba(214,224,245,.75)', F='rgba(238,241,248,.05)', T='#e9ecf6', M='#9aa6c4';
  let AC='#d8c53f';
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" fill="${o.c||T}" font-size="${o.s||14}" text-anchor="${o.a||'middle'}" font-weight="${o.w||700}" dominant-baseline="middle">${esc(s)}</text>`;
  const multi=(x,y,lines,o={})=>lines.map((l,i)=>txt(x,y+(i-(lines.length-1)/2)*(o.lh||(o.s||14)*1.25),l,o)).join('');
  const arrowHead=(x,y,ang,c=L,sz=7)=>{const a=ang*Math.PI/180;

const NB = new Audio("bgm/news_bgm.mp3"); NB.preload="auto"; NB.loop=false; NB.volume=0;

function nbTarget(nt){            /* nt: 뉴스 장면 시작 후 지난 시간 */
  const vt=nt-NEWS_INTRO;         /* 나레이션 시간 */
  if(nt < NEWS_INTRO-0.7) return NB_LOUD;
  if(vt < 0)               return NB_LOUD + (NB_UNDER-NB_LOUD)*((nt-(NEWS_INTRO-0.7))/0.7);
  if(vt < VOICE_END)       return NB_UNDER;
  if(vt < VOICE_END+2.5)   return NB_UNDER + (.5-NB_UNDER)*((vt-VOICE_END)/2.5);
  if(vt < VOICE_END+7)     return .5*(1-(vt-VOICE_END-2.5)/4.5);
  return 0;
}

  const nt=(performance.now()-newsT0)/1000;
  NB.volume=Math.max(0,Math.min(1,nbTarget(nt)));
  if(nt-NEWS_INTRO>VOICE_END+7){ NB.pause(); nbRaf=null; return; }
  nbRaf=requestAnimationFrame(nbLoop);
}
function newsStart(voice){
  newsVoice=voice; newsT0=performance.now();
  NB.currentTime=0; NB.volume=NB_LOUD; NB.play().catch(()=>{});
  if(!nbRaf) nbRaf=requestAnimationFrame(nbLoop);
  clearTimeout(newsTimer);
  newsTimer=setTimeout(()=>{ if(newsVoice!==voice) return;
    voice.currentTime=0; voice.volume=VOL;
    voice.play().catch(()=>toast("뉴스 파일(bgm/news.mp3)을 재생하지 못했습니다."));
  }, NEWS_INTRO*1000);
}
function newsStop(){
  clearTimeout(newsTimer); newsVoice=null; if(nbRaf){cancelAnimationFrame(nbRaf); nbRaf=null;}
  ramp(NB,0,1500,()=>NB.pause());
  const c=document.getElementById("nCap"); c.classList.add("off");
}
let capIdx=-2;
function syncCaption(a){
  const t=a.currentTime; let k=-1;
  for(let j=0;j<CAPTIONS.length;j++){
    const nextStart = j+1<CAPTIONS.length ? CAPTIONS[j+1][0] : Infinity;
    const end = (nextStart-CAPTIONS[j][1] < 1.0) ? nextStart : CAPTIONS[j][1];
    if(t>=CAPTIONS[j][0]&&t<end) k=j;
  }
  if(k===capIdx) return; capIdx=k;
  const c=document.getElementById("nCap");
  if(k<0){ c.classList.add("off"); return; }
  c.textContent=CAPTIONS[k][2]; c.classList.remove("off");
}
const TICKER = [
  "천문대 관측 중단 잇따라… ‘별 없는 하늘’ 2년째",
  "환경부, 도심 야간 조명 확대 지원책 발표",
  "기상청 “내일 전국 흐리고 미세먼지 매우 나쁨”",
  "강원 폐광 지대 일대 통행 통제… 출입 자제 당부",
  "정선 미술관 붕괴 사고 3년… 유가족 추모 행사 열려",
  "중국 우주기업 ‘앙시’, 차세대 우주선 시험 발사 예정",
  "「큐브관」 완공 1주년… 건축계 재조명",
  "태백산 일대 반딧불이 서식지 확대 관측"
];
(function(){ const run=document.getElementById("nRun");
  const once=TICKER.map(t=>`<span>${t}</span>`).join(""); run.innerHTML=once+once; })();
let hlIdx=-1;
function setHeadline(k,instant){
  if(k===hlIdx) return; hlIdx=k; const [_,tag,text]=HEADLINES[k];
  const hl=document.getElementById("nHl"), tg=document.getElementById("nTag");
  if(instant){ hl.textContent=text; tg.textContent=tag; return; }
  hl.classList.add("swap");
  setTimeout(()=>{ hl.textContent=text; tg.textContent=tag; hl.classList.remove("swap"); },450);
}
function syncHeadline(a){
  let k=0; for(let j=0;j<HEADLINES.length;j++) if(a.currentTime>=CAPTIONS[HEADLINES[j][0]][0]-0.2) k=j;
  setHeadline(k);
}

/* ---------- 두 플레이어로 교차 재생 ---------- */
const A=[new Audio(),new Audio()]; A.forEach(a=>{a.loop=true;a.preload="auto";a.volume=0;});
let front=0, cur=-1, started=false;
const pre=new Audio(); pre.preload="auto"; pre.muted=true;
const FADE=2600, VOL=1;
function ramp(a,to,ms,done){
  const from=a.volume, t0=performance.now();
  if(a._raf) cancelAnimationFrame(a._raf);
  const step=t=>{const k=Math.min(1,(t-t0)/ms); a.volume=Math.max(0,Math.min(1,from+(to-from)*k));
    if(k<1) a._raf=requestAnimationFrame(step); else {a._raf=null; done&&done();}};
  a._raf=requestAnimationFrame(step);
}
function playTrack(key){
  const old=A[front];
  ramp(old,0,FADE,()=>old.pause());
  if(!key) return;
  front=1-front; const a=A[front];
  if(a._key!==key){ a.src=src(key); a._key=key; }
  a.loop = key!=="news";
  a.ontimeupdate = key==="news" ? ()=>{ syncHeadline(a); syncCaption(a); } : null;
  a.currentTime=0; a.volume=0;
  if(key==="news"){ capIdx=-2; a.pause(); newsStart(a); return; }
  a.play().then(()=>ramp(a,VOL,FADE)).catch(()=>toast("음악을 재생하지 못했습니다. 화면을 한 번 더 눌러주세요."));
}

/* ---------- 장면 ---------- */
const $=id=>document.getElementById(id);
const tw=$("titleWrap"), stage=$("stage");
function go(i){
  if(i<0||i>=SCENES.length||i===cur) return;
  cur=i; const s=SCENES[i];
  tw.classList.add("out");
  if(!s.answer) setTimeout(()=>{ $("sceneNum").textContent=s.num; $("sceneTitle").textContent=s.title; $("sceneSub").textContent=s.sub;
    tw.classList.remove("out"); }, 900);
  stage.classList.toggle("dim",!!s.dim);
  stage.classList.toggle("answer",!!s.answer);
  if(s.answer) showAnswer(s);
  if(stage.classList.contains("news") && !s.news) newsStop();
  stage.classList.toggle("news",!!s.news);
  if(s.news) setHeadline(0,true);
  const live=A[front];
  if(!(s.track && live._key===s.track && !live.paused && s.track!=="news")) playTrack(s.track);
  // 다음 곡 미리 받아두기 (재생 중인 플레이어는 건드리지 않음)
  const n=SCENES[i+1]; if(n&&n.track&&n.track!=="news"){ pre.src=src(n.track); pre.load(); }
}

let last=0;
function tap(dir,el){
  const now=Date.now(); if(now-last<700) return; last=now;   // 두 번 눌림 방지
  keepAwake();
  if(!started){ started=true; $("start").classList.add("gone"); go(0); return; }
  el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),60);
  if(dir>0){ if(cur>=SCENES.length-1) null; else go(cur+1); }
  else     { if(cur<=0) null; else go(cur-1); }
}
$("zNext").addEventListener("click",e=>tap(1,e.currentTarget));
$("zPrev").addEventListener("click",e=>tap(-1,e.currentTarget));
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); tap(1,$("zNext")); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); tap(-1,$("zPrev")); }
});

/* ---------- 전체 화면 · 화면 꺼짐 방지 ---------- */
$("bFull").addEventListener("click",async e=>{
  e.stopPropagation();
  try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen({navigationUI:"hide"}); else await document.exitFullscreen(); }
  catch(err){ toast("전체 화면을 열지 못했습니다. 크롬 메뉴를 이용해주세요."); }
});
let lock=null;
async function keepAwake(){
  if(lock||!("wakeLock" in navigator)) return;
  try{ lock=await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>{lock=null;}); }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&started) keepAwake(); });

let tt; function toast(m){const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),3200);}


/* ---------- 자막 맞추기 (주소 끝에 #sync) ---------- */
if(location.hash==="#sync"){
  const box=$("sync"); box.hidden=false; $("start").classList.add("gone");
  let k=-1, voice=null; const marks=[];
  const show=()=>{
    if(k<0){ box.innerHTML="<b>자막 맞추기</b><br>화면을 누르면 뉴스가 처음부터 나옵니다. 앵커가 아래 문장을 <b>말하기 시작하는 순간</b>마다 화면을 누르세요.<br><br>첫 문장: "+CAPTIONS[0][2]; return; }
    if(k<CAPTIONS.length) box.innerHTML=`<b>${k+1} / ${CAPTIONS.length}</b> 이 문장이 시작되면 누르세요<br>${CAPTIONS[k][2]}`;
  };
  const finish=()=>{
    const out=CAPTIONS.map((c,i)=>{ const st=marks[i]; const en= i+1<marks.length? marks[i+1]-0.1 : st+(c[1]-c[0]); return [Math.round(st*10)/10, Math.round(en*10)/10]; });
    localStorage.setItem("cube_caps_v3",JSON.stringify(out));
    const code=out.map((v,i)=>`  [${v[0].toFixed(1)}, ${v[1].toFixed(1)}, "${CAPTIONS[i][2]}"]`).join(",\n");
    box.innerHTML=`<b>저장했습니다.</b> 이 태블릿에서는 이제 이 시간으로 자막이 나옵니다. 다른 기기에도 쓰려면 아래 내용을 index.html의 CAPTIONS에 붙여넣으세요.<textarea readonly>${code}</textarea>
      <div class="row"><button id="sAgain">다시 맞추기</button><button id="sReset">원래대로 되돌리기</button><button id="sDone">끝내기</button></div>`;
    $("sAgain").onclick=e=>{e.stopPropagation(); location.reload();};
    $("sReset").onclick=e=>{e.stopPropagation(); localStorage.removeItem("cube_caps_v3"); toast("원래 시간으로 되돌렸습니다."); };
    $("sDone").onclick=e=>{e.stopPropagation(); location.hash=""; location.reload();};
  };
  const onTap=e=>{
    e.stopImmediatePropagation(); e.preventDefault();
    if(k>=CAPTIONS.length) return;
    if(k<0){ started=true; go(1); k=0; show(); voice=A.find(x=>x._key==="news");
      if(voice) voice.addEventListener("ended",()=>{ if(k>=marks.length&&marks.length) {} }); return; }
    if(!voice) voice=A.find(x=>x._key==="news");
    marks[k]=Math.max(0,voice.currentTime-0.15); k++;
    if(k>=CAPTIONS.length) finish(); else show();
  };
  ["zNext","zPrev"].forEach(id=>$(id).addEventListener("click",onTap,true));
  show();
}

/* ---------- 반딧불이 ---------- */
(function(){
  const c=$("flies"), x=c.getContext("2d"); let W,H,dpr; const F=[];
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){dpr=Math.min(2,devicePixelRatio||1); W=c.width=innerWidth*dpr; H=c.height=innerHeight*dpr;}
  size(); addEventListener("resize",size);
  for(let i=0;i<26;i++) F.push({x:Math.random(),y:.35+Math.random()*.65,r:1+Math.random()*2.2,
    vx:(Math.random()-.5)*.00012,vy:-(.00005+Math.random()*.00012),p:Math.random()*6.28,s:.4+Math.random()*.9});
  function draw(t){
    x.clearRect(0,0,W,H);
    for(const f of F){
      if(!still){ f.x+=f.vx+Math.sin(t/4000+f.p)*.00006; f.y+=f.vy; if(f.y<-.02){f.y=1.02;f.x=Math.random();} }
      const a=.25+.55*(.5+.5*Math.sin(t/900*f.s+f.p)), px=f.x*W, py=f.y*H, r=f.r*dpr;
      const g=x.createRadialGradient(px,py,0,px,py,r*7); g.addColorStop(0,`rgba(232,212,80,${a})`); g.addColorStop(1,"rgba(232,212,80,0)");
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r*7,0,6.283); x.fill();
    }
    if(!still) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
