<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a16">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%223%22 y=%223%22 width=%2210%22 height=%2210%22 fill=%22%23d8c53f%22/%3E%3C/svg%3E">
<title>큐브관 살인사건 전말</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --sans:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --night:#060a16; --mist:#8d9bbb; --star:#eef1f8; --firefly:#d8c53f; --line:rgba(238,241,248,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{height:100%;margin:0;background:var(--night);color:var(--star);overflow:hidden;
  font-family:"Nanum Myeongjo","Noto Serif KR",serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

.stage{position:fixed;inset:0;overflow:hidden}
.art{position:absolute;inset:-2%;background:url("bg.jpg") center/cover no-repeat;
  filter:saturate(.85) brightness(.55);transform:scale(1.02);transition:filter 2.4s ease}
.stage.dim .art{filter:saturate(.6) brightness(.3)}
.veil{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 58%,rgba(6,10,22,0) 0%,rgba(6,10,22,.55) 55%,rgba(6,10,22,.92) 100%),
             linear-gradient(180deg,rgba(6,10,22,.65) 0%,rgba(6,10,22,0) 28%,rgba(6,10,22,0) 55%,rgba(6,10,22,.9) 100%)}
canvas#flies{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 3.2vh);left:4vw;pointer-events:none;
  font-weight:800;color:var(--firefly);letter-spacing:.04em;font-size:clamp(14px,1.9vw,26px);line-height:1.25;opacity:.92}
.brand small{display:block;font-weight:400;color:var(--mist);font-size:.48em;letter-spacing:.38em;margin-top:.5em}

.title-wrap{position:absolute;left:6vw;right:6vw;bottom:15vh;text-align:center;pointer-events:none}
.scene-num{font-weight:700;color:var(--firefly);font-size:clamp(18px,2.6vw,38px);letter-spacing:.3em;text-indent:.3em;
  margin-bottom:1.4vh;min-height:1.2em}
.scene-title{font-weight:800;font-size:clamp(34px,6.2vw,92px);line-height:1.18;text-shadow:0 2px 30px rgba(0,0,0,.6);word-break:keep-all}
.scene-sub{margin-top:2.2vh;color:var(--mist);font-size:clamp(13px,1.55vw,22px);letter-spacing:.08em;min-height:1.4em}
.title-wrap .t{transition:opacity 1.1s ease,transform 1.1s ease}
.title-wrap.out .t{opacity:0;transform:translateY(8px)}

/* 화면 반쪽씩: 왼쪽 이전, 오른쪽 다음 */
.zone{position:absolute;top:0;bottom:0;width:50%;border:0;padding:0;margin:0;background:transparent;cursor:pointer}
.zone.prev{left:0}.zone.next{right:0}
.zone:focus-visible{outline:2px solid var(--firefly);outline-offset:-6px}
.zone .hint{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;
  display:grid;place-items:center;color:var(--star);background:rgba(6,10,22,.4);opacity:0;transition:opacity .5s}
.zone.prev .hint{left:2.4vw}.zone.next .hint{right:2.4vw}
.zone.flash .hint{opacity:.85;transition:none}
.zone .hint svg{width:22px;height:22px}


.full{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);
  width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(6,10,22,.35);color:var(--mist);
  display:grid;place-items:center;opacity:.45;cursor:pointer;z-index:5}
.full:focus-visible{outline:2px solid var(--firefly);outline-offset:2px;opacity:1}
.full svg{width:18px;height:18px}

.start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;
  padding:14px 22px;border-radius:14px;border:1px solid var(--line);background:rgba(6,10,22,.55);
  color:var(--star);font-size:clamp(15px,1.7vw,22px);letter-spacing:.06em;transition:opacity .6s}
.start.gone{opacity:0}
.toast{font-family:var(--sans);position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translateX(-50%);z-index:6;
  padding:10px 16px;border-radius:10px;background:rgba(8,13,28,.92);border:1px solid var(--line);font-size:14px;
  opacity:0;transition:opacity .3s;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1}
.newsart{position:absolute;inset:0;background:url("news.jpg") center/cover no-repeat;opacity:0;transition:opacity 1.6s ease}
.brand,.title-wrap,canvas#flies{transition:opacity 1.2s ease}
.stage.news .newsart{opacity:1}
.stage.news .brand,.stage.news .title-wrap,.stage.news canvas#flies,.stage.news .veil{opacity:0}
.newsui{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease .4s}
.stage.news .newsui{opacity:1}
.bug{font-family:var(--sans);position:absolute;top:calc(env(safe-area-inset-top,0px) + 3.4vh);left:3.2vw;display:flex;align-items:center;gap:.8vw}
.bug .mark{width:clamp(10px,1vw,16px);height:clamp(10px,1vw,16px);background:var(--firefly)}
.bug .ch{font-weight:800;font-size:clamp(14px,1.7vw,24px);letter-spacing:.06em}
.bug .dt{color:var(--mist);font-size:clamp(12px,1.25vw,18px);letter-spacing:.1em;margin-left:.4vw}
.lower{font-family:var(--sans);position:absolute;left:3.2vw;right:3.2vw;bottom:calc(env(safe-area-inset-bottom,0px) + 10.5vh);
  display:flex;align-items:stretch;background:rgba(6,10,22,.86);border-top:2px solid var(--firefly);
  box-shadow:0 10px 40px rgba(0,0,0,.45)}
.lower .tag{flex:0 0 auto;display:grid;place-items:center;padding:0 1.6vw;background:var(--firefly);color:#15130a;
  font-weight:800;font-size:clamp(14px,1.8vw,26px);letter-spacing:.12em}
.lower .hl{flex:1;min-width:0;padding:1.6vh 2vw;font-weight:800;letter-spacing:-.02em;font-size:clamp(20px,3.1vw,46px);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .45s ease,transform .45s ease}
.lower .hl.swap{opacity:0;transform:translateY(10px)}
.cap{font-family:var(--sans);letter-spacing:-.01em;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 27vh);
  width:min(84vw,1200px);text-align:center;font-weight:700;font-size:clamp(16px,2.15vw,32px);line-height:1.5;word-break:keep-all;
  padding:.5em 1em;background:rgba(6,10,22,.72);text-wrap:balance;border-radius:6px;text-shadow:0 1px 3px rgba(0,0,0,.6);
  transition:opacity .35s ease}
.cap.off{opacity:0}
.ticker{font-family:var(--sans);position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 3.6vh);height:clamp(30px,5.2vh,52px);
  display:flex;align-items:center;background:rgba(15,26,51,.94);overflow:hidden}
.ticker .lab{flex:0 0 auto;height:100%;display:grid;place-items:center;padding:0 1.4vw;background:#1c2a4f;
  color:var(--firefly);font-weight:700;font-size:clamp(12px,1.4vw,20px);letter-spacing:.08em;z-index:1}
.ticker .run{display:flex;white-space:nowrap;will-change:transform;animation:run 70s linear infinite}
.ticker .run span{font-weight:500;font-size:clamp(13px,1.55vw,22px);padding-right:3vw;color:var(--star)}
.ticker .run span::before{content:"";display:inline-block;width:.45em;height:.45em;background:var(--firefly);margin:0 1.1vw 0 0;vertical-align:.15em}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ans{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .9s ease;
  --ink:rgba(201,214,242,.8); --ink2:rgba(201,214,242,.26); --ink3:rgba(201,214,242,.12); --body:#c4cce0;
  background:radial-gradient(ellipse 70% 80% at 26% 52%,rgba(22,34,70,.5),rgba(22,34,70,0) 70%),linear-gradient(180deg,#070b19,#04070f);
  padding:calc(env(safe-area-inset-top,0px) + 5vh) 4.4vw calc(env(safe-area-inset-bottom,0px) + 4.6vh);
  display:grid;grid-template-rows:auto minmax(0,1fr);row-gap:3.4vh}
.stage.answer .ans{opacity:1}
.stage.answer .title-wrap,.stage.answer .brand{opacity:0}
.ans .hd{margin:0;font-weight:800;font-size:clamp(26px,3.2vw,58px);line-height:1.15;letter-spacing:-.01em;color:#fff;word-break:keep-all}
.ans .hd .br{color:var(--acc);font-weight:400}
.ans .bd{min-height:0;display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);gap:4vw}
/* 왼쪽: 도면 한 장 */
.ans .sheet{position:relative;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;border:1px solid var(--ink2);
  background:linear-gradient(var(--ink3) 1px,transparent 1px) -1px -1px/calc(100% / 16) calc(100% / 11),
    linear-gradient(90deg,var(--ink3) 1px,transparent 1px) -1px -1px/calc(100% / 16) calc(100% / 11),#081024}
.ans .sheet::before{content:"";position:absolute;inset:clamp(6px,.6vw,12px);border:1px solid var(--ink2);pointer-events:none}
.ans .fig{min-height:0;display:flex;align-items:center;justify-content:center;padding:2.4vh 2vw 1vh}
.ans .fig svg{width:100%;height:100%;max-height:100%}
.ans .tb{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;margin:0 clamp(6px,.6vw,12px) clamp(6px,.6vw,12px);
  border-top:1px solid var(--ink2);background:rgba(6,11,26,.92);font-family:var(--sans)}
.ans .tb>div{padding:1.1vh 1.4vw;display:flex;flex-direction:column;justify-content:center;gap:.35em}
.ans .tb>div+div{border-left:1px solid var(--ink2)}
.ans .tb>div[hidden]{display:none}
.ans .tb .code{font-family:"Bodoni Moda",serif;font-weight:600;color:var(--acc);font-size:clamp(28px,3vw,56px);line-height:1;letter-spacing:.01em}
.ans .tb .k{color:var(--mist);font-size:clamp(11px,.85vw,15px);letter-spacing:.04em}
.ans .tb .v{color:var(--star);font-weight:600;font-size:clamp(13px,1.15vw,21px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 오른쪽: 읽는 글 */
.ans .tx{min-height:0;overflow:hidden;display:flex;flex-direction:column}
.ans .q{margin:0 0 3vh;padding:0 0 2.8vh;border-bottom:1px solid var(--ink2)}
.ans .q .qn{display:block;font-family:var(--sans);font-weight:600;color:var(--acc);font-size:clamp(13px,1.1vw,20px);letter-spacing:.04em;margin-bottom:.9em}
.ans .q .qt{display:block;font-weight:700;color:#fff;font-size:clamp(20px,1.95vw,36px);line-height:1.55;word-break:keep-all;text-wrap:pretty}
.ans .a{font-family:var(--sans);font-weight:400;color:var(--body);font-size:clamp(17px,1.56vw,29px);line-height:1.85;letter-spacing:-.005em;
  word-break:keep-all;text-wrap:pretty;transition:opacity .2s ease}
.ans .a p{margin:0 0 1em}
.ans .a p:last-child{margin-bottom:0}
.ans .a b{font-weight:600;color:#fff}
.ans .a q{quotes:"“" "”";color:#e3e8f3}
.ans .pg{margin-top:auto;padding-top:2.4vh;display:flex;gap:clamp(5px,.45vw,9px)}
.ans .pg i{display:block;width:clamp(20px,2.2vw,40px);height:3px;background:var(--ink2);transition:background .3s}
.ans .pg i.on{background:var(--acc)}
.ans .pg[hidden]{display:none}
#letter{position:absolute;inset:0;z-index:2;background:#000;opacity:0;pointer-events:none;transition:opacity 1.6s ease;overflow:hidden}
.stage.letter #letter{opacity:1}
.stage.letter .brand,.stage.letter .title-wrap,.stage.letter canvas#flies,.stage.letter .veil{opacity:0}
#letter .ph{position:absolute;inset:-6%;background:center/cover no-repeat;opacity:0;will-change:transform,opacity,filter}
#letter .grain{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1px);background-size:3px 3px}
#letter .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%),
  linear-gradient(180deg,rgba(0,0,0,0) 62%,rgba(0,0,0,.72) 100%)}
#letter .lcap{position:absolute;left:8vw;right:8vw;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);text-align:center;
  font-weight:700;font-size:clamp(17px,2.25vw,34px);line-height:1.55;color:#f6f1e6;text-shadow:0 2px 12px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9);
  word-break:keep-all;text-wrap:balance;transition:opacity .45s ease}
#letter .lcap.off{opacity:0}
#letter .endcard{position:absolute;inset:0;display:grid;place-items:center;background:#000;opacity:0;transition:opacity 2.5s ease;text-align:center}
#letter .endcard.on{opacity:1}
#letter .endcard .ttl{color:var(--firefly);font-weight:800;font-size:clamp(26px,4vw,60px);letter-spacing:.04em;
  opacity:0;transform:translateY(6px);transition:opacity 4.5s ease 1.5s, transform 4.5s ease 1.5s}
#letter .endcard .fin{margin-top:3.2vh;color:var(--mist);font-weight:400;font-size:clamp(13px,1.35vw,20px);letter-spacing:.6em;text-indent:.6em;
  opacity:0;transition:opacity 4s ease 7s}
#letter .endcard.on .ttl{opacity:1;transform:none}
#letter .endcard.on .fin{opacity:1}
.pst{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.stage.poster .pst{opacity:1}
.stage.poster .art{filter:saturate(.95) brightness(.86)}
.stage.poster .veil{background:linear-gradient(90deg,rgba(6,10,22,.55) 0%,rgba(6,10,22,0) 38%),
  linear-gradient(0deg,rgba(6,10,22,.82) 0%,rgba(6,10,22,0) 42%),linear-gradient(180deg,rgba(6,10,22,.5) 0%,rgba(6,10,22,0) 25%)}
.stage.poster .brand,.stage.poster .title-wrap{opacity:0}
.pst .tag{position:absolute;left:4.2vw;top:calc(env(safe-area-inset-top,0px) + 6vh);color:#f2f4fa}
.pst .tag .ko{font-weight:700;font-size:clamp(16px,2.05vw,30px);line-height:1.6;letter-spacing:.14em;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.pst .tag .en{margin-top:1.6vh;font-family:"Bodoni Moda",serif;font-size:clamp(9px,.82vw,13px);letter-spacing:.32em;line-height:1.9;color:#c9d1e4;opacity:.9}
.pst .ttl{position:absolute;right:4.2vw;bottom:calc(env(safe-area-inset-bottom,0px) + 6.5vh);text-align:right}
.pst .ttl .k1{font-weight:800;color:#d9c440;font-size:clamp(46px,8.2vw,150px);line-height:1;letter-spacing:.02em;text-shadow:0 4px 30px rgba(0,0,0,.55)}
.pst .ttl .k2{font-weight:800;color:#d9c440;font-size:clamp(28px,4.9vw,90px);line-height:1.15;margin-top:.5vh;text-shadow:0 4px 30px rgba(0,0,0,.55)}
.pst .ttl .en{margin-top:2.2vh;font-family:"Bodoni Moda",serif;font-weight:500;color:#f2f4fa;font-size:clamp(20px,3.3vw,62px);letter-spacing:.015em;line-height:1;text-shadow:0 3px 20px rgba(0,0,0,.6)}
.pst .vert{position:absolute;top:50%;right:1.5vw;transform:translateY(-50%);writing-mode:vertical-rl;font-family:"Bodoni Moda",serif;
  font-size:clamp(9px,.75vw,12px);letter-spacing:.9em;color:#c9d1e4;opacity:.55}
.pst .vert.l{right:auto;left:1.5vw;transform:translateY(-50%) rotate(180deg)}
.stage.poster .start{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 4vh);left:50%;transform:translateX(-50%);font-size:clamp(13px,1.2vw,17px);
  background:rgba(6,10,22,.4);padding:10px 18px;letter-spacing:.2em}
.sync{font-family:var(--sans);position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 9vh);transform:translateX(-50%);z-index:7;
  width:min(86vw,980px);padding:16px 20px;border-radius:12px;background:rgba(8,13,28,.94);border:1px solid var(--firefly);
  font-size:clamp(14px,1.6vw,20px);line-height:1.6;pointer-events:none}
.sync b{color:var(--firefly)}
.sync textarea{width:100%;height:30vh;margin-top:10px;background:#0b1224;color:var(--star);border:1px solid var(--line);
  border-radius:8px;font:13px/1.5 monospace;padding:8px;pointer-events:auto}
.sync .row{display:flex;gap:10px;margin-top:10px;pointer-events:auto}
.sync button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:rgba(238,241,248,.08);font-weight:700}
@media (prefers-reduced-motion: reduce){ .title-wrap .t,.art{transition:none} .ticker .run{animation-duration:140s} }
</style>
</head>
<body>
<div class="stage poster" id="stage">
  <div class="art"></div>
  <div class="newsart"></div>
  <canvas id="flies"></canvas>
  <div class="veil"></div>
  <div class="brand">큐브관 살인사건 전말<small>MURDER IN THE CUBE</small></div>
  <div class="pst" aria-hidden="true">
    <div class="tag"><div class="ko">별 하나로 만든 총알,<br>큐브관을 향해 쏘다.</div>
      <div class="en">WITH A BULLET MADE OF<br>STARS, SHOOT AT THE CUBE</div></div>
    <div class="ttl"><div class="k1">큐브관</div><div class="k2">살인사건 전말</div><div class="en">MURDER IN THE CUBE</div></div>
    <div class="vert">MURDER IN THE CUBE</div><div class="vert l">MURDER IN THE CUBE</div>
  </div>
  <div class="title-wrap" id="titleWrap">
    <div class="t scene-num" id="sceneNum"></div>
    <div class="t scene-title" id="sceneTitle">큐브관 살인사건 전말</div>
    <div class="t scene-sub" id="sceneSub"></div>
  </div>

  <div class="newsui" aria-hidden="true">
    <div class="bug"><span class="mark"></span><span class="ch">저녁 뉴스</span><span class="dt">2030. 8. 21</span></div>
    <div class="cap off" id="nCap"></div>
    <div class="lower"><div class="tag" id="nTag">뉴스</div><div class="hl" id="nHl">2030년 8월 21일 저녁 뉴스</div></div>
    <div class="ticker"><div class="lab">주요 뉴스</div><div class="run" id="nRun"></div></div>
  </div>

  <button class="zone prev" id="zPrev" aria-label="이전 장면">
    <span class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></span>
  </button>
  <button class="zone next" id="zNext" aria-label="다음 장면">
    <span class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></span>
  </button>

  <button class="full" id="bFull" aria-label="전체 화면">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <div class="start" id="start">화면을 눌러 시작</div>
  <div class="letter" id="letter" aria-hidden="true">
    <div class="ph" id="ph0"></div><div class="ph" id="ph1"></div>
    <div class="grain"></div><div class="vig"></div>
    <div class="lcap off" id="lCap"></div>
    <div class="endcard" id="endcard"><div class="ec"><div class="ttl">큐브관 살인사건 전말</div><div class="fin">THE END</div></div></div>
  </div>
  <div class="ans" id="ans" aria-live="polite">
    <h2 class="hd" id="aTitle"></h2>
    <div class="bd">
      <figure class="sheet" style="margin:0">
        <div class="fig" id="aFig"></div>
        <div class="tb">
          <div><span class="code" id="aBadge"></span></div>
          <div><span class="k" id="aRound"></span><span class="v" id="aCase"></span></div>
          <div id="aPartBox"><span class="k">수수께끼</span><span class="v" id="aPart"></span></div>
        </div>

const ANSWERS = {"A1": [[null, "범인은 미리 쪽지를 남겨 두고, 밤중에 김유진의 방을 201에서 꼭대기 층 304로 옮겼습니다. 새벽 2시, 김유진이 약속 장소로 가려고 문을 여는 순간 꼭대기 층에서 떨어지도록 만든 것입니다.\n큐브관의 방문은 바깥으로 밀어서 여는 구조라, 문을 밀면 자연스럽게 발이 앞으로 나갑니다. 복도의 검은 유리도, 바깥의 밤도 똑같이 새까매서 분간이 되지 않았고, 방 안의 수면 유도 기체 때문에 새벽 2시의 김유진은 잠에 취해 있었습니다.\n게다가 김유진은 첫 번째 사망자입니다. 그전까지 아무 일도 없었으니 경계할 이유가 없었고, 아무 대비 없이 문을 열었다가 떨어졌습니다.\n김유진이 죽은 뒤, 범인은 옥상으로 올라가 문을 닫고 방을 원래 자리로 돌려 놓았습니다."]], "A2": [["한도경의 밀실은 어떻게 만들었을까요?", "저녁을 먹는 동안, 김세영이 자기 방과 한도경의 방을 바꿔 두었습니다. 두 사람은 함께 1층으로 내려와 각자 문 앞에서 잠금을 풀었는데, 그때 두 방은 이미 서로 바뀐 상태였습니다.\n세영이 잘 자라고 인사했고, 서로 인사를 주고받은 그 대화로 각자 상대 방의 잠금이 풀린 셈이 됐습니다. 큐브관은 복도에서 평범하게 말해도 복도 전체에 또렷이 들리도록 설계되어 있어서, 소리칠 필요도 없었습니다.\n한도경은 세영의 방에 들어가 문을 잠갔습니다. 하지만 잠그는 건 누구 목소리로도 되기 때문에, 그 방의 주인인 세영은 언제든 다시 열고 들어갈 수 있었습니다.\n세영은 그 방에 들어가 독을 묻힌 짧은 나이프로 한도경을 죽였습니다. 짧은 나이프만으로는 사람을 죽일 수 없으니 독이 필요했던 것입니다. 그다음 시신을 한도경의 방으로 옮기고, 방을 제자리로 돌린 뒤 잠가서 밀실처럼 보이게 했습니다.\n이 수법이 성립하면 범인은 김세영으로 확정됩니다."], ["한도경 방의 노크 소리는 어떻게 꾸몄을까요?", "밤 10시, 창문을 두드리는 시간이 되자 세영은 원격 조작으로 방을 먼저 101 자리로 옮겨 자기 창문을 두드렸습니다. 한도경 쪽에서 나는 소리처럼 꾸민 것입니다. 그리고 다시 103으로 돌려 자기 차례에 한 번 더 두드렸습니다.\n세영은 마침 한도경 바로 다음 순서로 창문을 두드리는 사람입니다. 원격 조작은 즉시 이뤄지는 설정이라, 5초면 충분합니다."]], "A3": [["다인은 밥을 먹고 방에 돌아와 문을 잠그고 잤습니다. 범인은 어떻게 문을 열었을까요?", "모두가 식당에 있는 동안, 범인이 다인의 방과 자기 방을 바꿔 두었습니다. 범인은 김세영입니다.\n다인이 들어간 곳은 사실 세영의 방이었고, 다인은 거기서 문을 잠그고 잠들었습니다. 그리고 세영의 방에는 약이 있었습니다.\n세영이 중간에 문을 두드린 건, 다인이 약에 취했는지 확인하기 위해서였습니다. 아직 깨어 있으면 들어가지 않고, 약이 돌기를 기다렸다가 잠금을 풀고 들어갔습니다."], ["사방이 열리지 않는 방에서, 다인은 어떻게 물에 빠져 죽었을까요?", "범인은 화장실 물을 틀어 놓고 그냥 흘려보냈습니다. 물 사용량이 이상하니 다들 화장실 물에만 매달리게 되고, 실제로 다인을 죽인 물, 바로 빗물은 가려집니다.\n전날에는 밤새 큰비가 내렸습니다. 범인은 먼저 김유진 방의 카펫을 걷어, 유진의 방문 밖 복도에 원래 있던 카펫 위에 겹쳐 깔았습니다. 아무도 지나가지 않는 자리라, 바닥이 조금 높아진 걸 아무도 눈치채지 못합니다.\n그다음 유진의 방을 식당 자리, 즉 꼭대기 층으로 옮겨 문이 위를 보게 하고, 옥상에 올라가 문을 열어 밤새 빗물을 받았습니다. 날이 밝으면 다들 식당에 밥을 먹으러 오니 그 전에 되돌려 놓습니다. 되돌린 뒤에도 문은 위를 향해야, 물이 문을 밀어 열지 않습니다.\n밥을 먹은 뒤 문태오와 김미래의 시점에 머리가 아프고 몽롱하다는 대목이 나오는데, 사실은 음식에 약을 탄 것입니다. 세영은 낮잠 시간에 모두가 곯아떨어진 틈을 타 움직였습니다.\n물을 채운 유진의 방을 문태오의 방 자리로 옮기고, 다인이 잠든 방의 문을 위로 돌린 뒤, 호스와 펌프를 들고 옥상에 올라갔습니다. 두 문을 열고 유진 방의 물을 세영의 방으로 퍼 넣어 다인을 빠뜨렸습니다. 방 깊이가 4미터, 방 사이가 4미터이니 8미터짜리 호스면 바닥의 물까지 닿습니다.\n다인이 죽은 뒤에는 물을 다시 유진의 방으로 퍼 옮기고, 문을 닫고 방을 제자리로 돌렸습니다. 그리고 시신과 젖은 카펫을 다인의 방으로 옮기고, 다인 방의 마른 카펫은 세영의 방에 깔았습니다.\n물이 가득한 유진의 방은 201 자리로 되돌렸습니다. 그러면 문이 북쪽을 보게 되고, 물의 압력이 잠기지 않은 문을 밀어 열어 물이 전부 바깥으로 빠져나갑니다. 북쪽에는 한도경뿐인데 이미 죽었으니 아무도 보지 못하고, 바깥 소리는 안에서 들리지 않으니 물소리도 들리지 않습니다.\n마지막으로 유진 방의 마른 카펫을 원래대로 되돌려 놓았습니다."]], "A4": [["미래는 왜 세영을 찾아가다 창고에 들어갔고, 세영은 왜 미래를 찾다가 다인의 시신을 봤을까요?", "김세영이 창고와 자기 방을 바꿔 두었고, 미래는 304, 다인의 방에서 깨어났습니다.\n다인의 방에서 세영을 찾아가려면 두 층 아래 03호실로 가야 합니다. 그런데 세영이 그 자리를 창고와 바꿔 놓았으니, 미래는 창고로 들어가게 됩니다.\n반대로 세영이 미래를 찾으려면 한 층 위 04호실로 가야 합니다. 세영의 방은 203으로 옮겨져 있었으니 세영은 304로 가게 되고, 거기서 다인의 시신을 보게 됩니다."], ["미래는 왜 사방이 열리지 않는 방에 있었고, 두 면의 유리 밖으로 반딧불이가 보였을까요?", "미래는 204, 자기 방에서 죽었습니다. 범인은 미래의 방을 문이 아래를 보도록 돌렸는데, 아래는 화장실 천장이라 문이 열리지 않습니다.\n그다음 한도경의 방을 304로 옮기고, 역시 문이 아래를 보게 했습니다. 그러면 미래의 방에서 위를 향한 매직미러를 지나, 한도경 방문 맞은편의 매직미러를 통해 꼭대기 층 바깥의 반딧불이가 보입니다.\n카펫은 방의 오른쪽 벽, 원래의 바닥에 있습니다. 그래서 미래에게는 두 면의 창이 자기 주위 네 면 가운데 두 곳에 있는 셈이 됩니다.\n다만 문제가 하나 남습니다. 한쪽 창밖의 반딧불이는 보통 거리에 있는데, 다른 쪽은 4미터 더 멀리 있습니다. 어떻게 눈치채지 못하게 했을까요? 창고에는 잠자리채가 있습니다. 범인은 반딧불이 몇 마리를 잡아 한도경의 방에 넣어 거리감을 맞췄습니다."]], "B1": [[null, "범인은 중력 카펫을 2층 복도 남쪽 벽에 붙였습니다. 김유진이 새벽에 문을 열고 나가면, 복도 쪽 중력에 끌려 복도 길이만큼 옆으로 떨어져 죽습니다. 방 위치상 그 거리는 8미터가 넘으니, 7미터 넘는 높이에서 떨어졌다는 조건도 맞습니다.\n그렇다면 복도에 떨어진 피는 어떻게 처리했을까요? 유리에 묻은 피는 닦기 쉽지만, 카펫에 스미면 지우기 어렵습니다. 그래서 범인은 물이 스미지 않는 면, 즉 카펫의 뒷면을 이용했습니다.\n먼저 복도의 카펫을 모두 걷고, 한 장을 벽에 붙여 중력장을 만듭니다. 나머지는 뒤집어 그 위에 올려 두는데, 평평하게 깔면 중력장이 생겨 버리니 벽 모서리에 구부려 세워 둡니다. 이 카펫들이 중력장을 만드는 카펫을 덮어 보호합니다.\n범인은 창고의 카트로 시신을 큐브관 밖 동쪽 바닥으로 옮겨, 옥상에서 떨어진 것처럼 꾸몄습니다. 단서에 전날 밤 흙바람이 한 차례 불어 핏자국이 덮이고 흩어졌다고 나옵니다. 그래서 시신 주변의 흔적으로는 아무것도 알 수 없고, 그 자리가 처음 현장이 아닐 수도 있다는 뜻이 됩니다."]], "B2": [["한도경의 밀실은 어떻게 만들었을까요?", "한도경의 시점에 이런 대목이 있습니다. \"저녁 시간, 나는 먼저 화장실에 한 번 다녀왔다. 그러고 식당으로 가던 길에 문득 방문을 안 잠근 게 생각나서, 돌아가 문을 잠그고 나서야 식당에 갔다.\" 그 사이에 범인이 방에 들어가 무언가를 설치할 시간이 있었다는 뜻입니다.\n범인은 조명 아래 카펫 한 귀퉁이를 접어 나이프로 눌러 두고, 독을 묻힌 양철 조각들을 위로 던졌습니다. 양철은 천장에 닿으면 그대로 붙어 있습니다.\n한도경이 돌아와 문을 잠근 뒤, 구석 조명 아래 은빛으로 번쩍이는 나이프를 보고 집어 들었습니다. 그 순간 카펫이 탄성으로 펴지면서, 날카로운 조각들이 4미터 위에서 쏟아져 그를 베었습니다."], ["한도경 방의 노크 소리는 어떻게 꾸몄을까요?", "바깥에서 두드렸습니다. 이 수법으로 범인이 김세영으로 확정됩니다.\n세영과 한도경은 둘 다 1층에 있고, 세영은 큐브관 밖으로 나가 바깥에서 창을 두드렸습니다. 밖에서 보면 두 사람의 유리는 4미터 거리라, 5초면 충분히 오갈 수 있습니다."]], "B3": [["다인은 밥을 먹고 방에 돌아와 문을 잠그고 잤습니다. 범인은 어떻게 문을 열었을까요?", "다인이 방에 돌아왔을 때, 방 안에는 이미 사람이 있었습니다.\n증언 2를 보면 두 딸 중 한 명은 앞을 보지 못합니다. 시점을 맞춰 보면 미래는 분명히 앞을 볼 수 있습니다. 그런데 다인의 시점에는 자기 눈으로 본 장면이 하나도 없습니다. 그러니 앞을 보지 못하는 사람은 박다인입니다.\n다인은 식당에 가면서 문을 잠그지 않았고, \"마지막으로 다 먹고 식당을 나온\" 사람이었습니다. 그러니 범인은 식당을 나온 뒤 다인의 방에 먼저 들어가 있었던 것입니다.\n다인이 돌아와 문을 잠그고 잠든 뒤, 범인은 카펫 이야기를 물어 다인이 대답하게 만들었습니다. 그때 범인은 문 안쪽에 손바닥을 대고 있었습니다. 다인이 대답하는 순간 잠금이 풀렸고, 다인은 계속 잤지만 문은 이미 열려 있었습니다.\n누가 우연히 문을 두드려 주기를 기대할 수는 없으니, 문을 두드린 사람이 곧 범인입니다. 바로 김세영입니다.\n그런데 다인이 들은 건 문밖에서 나는 목소리였습니다. 범인은 방 안에 있었는데, 어떻게 목소리가 밖에서 났을까요? 녹음기입니다. 미리 그 말을 녹음해 두고, 사람은 안에, 녹음기는 밖에 둔 채 블루투스로 틀면 됩니다."], ["사방이 열리지 않는 방에서, 다인은 어떻게 물에 빠져 죽었을까요?", "범인은 다인을 재운 뒤 1층으로 데려가, 중력 카펫을 1층 복도 서쪽 벽에 붙이고 그 공간에서 화장실 물로 빠뜨렸습니다.\n중력장은 카펫에서 수직으로 맞은편 나노 자성 유리까지 생기니, 복도의 가로 구역 전체가 됩니다. 호스가 그 구역 어디에든 닿기만 하면, 물은 서쪽으로 떨어집니다. 호스 길이도 충분합니다.\n다인이 열지 못한 네 면은 바닥, 천장, 한도경 쪽 벽, 그리고 세영의 방문이었습니다."]], "B4": [["미래는 왜 세영을 찾아가다 창고에 들어갔고, 세영은 왜 미래를 찾다가 다인의 시신을 봤을까요?", "다인의 시신은 204, 미래의 방에 있습니다. 미래는 204에서 깨어나 그곳이 다인의 방인 줄 알고, 두 층 아래 03호실로 가려 했습니다.\n202 전송실에서 아래 버튼을 눌러 102에 도착했는데, 범인이 미리 102 전송실의 카펫을 천장에 붙여 두었습니다. 미래는 천장에 서게 되고, 위아래 버튼이 뒤집힙니다. 1층 전송실에도 아래 버튼이 있지만, 원래 작동하지 않습니다.\n그래서 미래가 한 번 더 아래를 눌렀는데 실은 위 버튼이었고, 다시 202로 돌아왔습니다. 그렇게 나와서 03호실로 가니 창고였습니다.\n세영은 방 자리가 바뀌지 않았으니 103에서 204로 올라갔고, 거기서 다인의 시신을 봤습니다."], ["미래는 왜 사방이 열리지 않는 방에 있었고, 두 면의 유리 밖으로 반딧불이가 보였을까요?", "미래는 304, 다인의 방에 있었습니다. 꼭대기 층 방은 매직미러가 세 면인데, 범인이 304의 동쪽 벽에 카펫을 붙여 한 면을 가렸습니다.\n미래에게는 그 카펫이 바닥이 됩니다. 그 위에 선 미래의 주위로는 남쪽 유리와 천장 유리, 두 면이 남습니다.\n방문은 미래에게 천장이 되어, 잠겨 있지 않았는데도 손이 닿지 않아 열 수 없었습니다."]], "C1": [[null, "범인은 김유진을 재워서 301에 눕혀 두었습니다. 유진의 시점에 잘 때 문을 잠그지 않았고, 그 뒤 문을 열고 약속 장소로 나갔다고 했으니, 유진은 4층으로 올라가게 됩니다.\n범인은 미리 4층 전송실과 복도의 카펫을 천장에 붙여 두었습니다. 유진이 올라오면 위아래가 뒤집혀 있으니, 다인 방의 북쪽 유리벽을 두드리게 됩니다. 유진에게는 그게 01호실 문으로 보이기 때문입니다.\n범인이 미리 다인을 재워 두었으니 다인은 문을 열지 않습니다. 꼭대기 층에는 다인뿐이라 다른 사람도 듣지 못합니다.\n문 앞에서 돌아선 유진은 자기 방으로 내려가려 합니다. 하지만 4층 전송실이 뒤집혀 있으니, 아래인 줄 알고 누른 버튼이 위였고 옥상으로 올라갑니다. 범인은 옥상에서 기다리다가, 올라온 유진을 밀었습니다."]], "C2": [[null, "범인은 약으로 한도경을 방에서 재웠습니다. 사람들이 문을 부수고 들어간 뒤, 독을 묻힌 짧은 나이프로 한 번 그었습니다. 수법은 아주 간결합니다.\n범인은 문태오로 특정됩니다. 문을 부순 뒤 \"태오 씨가 다가가 맥을 짚어보니\"라는 대목이 나옵니다. 그 틈에 태오는 소매에 숨겨 둔 나이프로 피부를 긋고 시신 옆에 놓았습니다.\n나중에 태오를 구할 때 \"긴 소매의 소맷부리가 밧줄로 묶여 있어\"라는 대목이 나오니, 태오는 긴 소매를 입고 있었고 칼을 숨길 수 있었습니다. 현장은 \"어둑한 조명이 켜져 있었고\"라고 묘사되고, 한도경은 남동쪽 구석에 쓰러져 있었으니 태오가 다가가 쭈그려 앉으면 반드시 다른 사람들에게 등을 지게 됩니다. 유리 조각이 몸에 상처를 많이 냈으니, 나이프 자국은 그 사이에 묻힙니다.\n동시에 태오가 묶여 있던 일도 풀립니다. 태오가 범인이라면, 그건 자작극입니다.\n그날 밤 조명에서 향이 나지 않았다는 대목이 있습니다. 다른 날에는 늘 향이 났습니다. 그 향에 약이 들어 있었던 것입니다. 매일 밤 모두가 깊이 잠들었기에, 한 명씩 죽일 수 있었습니다.\n그런데 그날만큼은 사람들을 재우면 안 됐습니다. 납치극으로 모두를 깨워 모아야 했으니까요. 그래야 한도경이 없어진 걸 알아채고, 태오가 큐브 두 면을 맞춰 놓아 한도경이 방 안에서 이미 죽었다고 믿게 만들어 문을 부수게 하고, 가장 먼저 다가가 수법을 마무리할 수 있습니다.\n다음 날 아침까지 기다리면 한도경의 약도 깹니다. 이제 한도경은 10시 전에 죽은 것이 아니니, 창문을 두드린 소리는 한도경 본인이 낸 것입니다."]], "C3": [["다인은 밥을 먹고 방에 돌아와 문을 잠그고 잤습니다. 범인은 어떻게 문을 열었을까요?", "이 수법은 뒤집히지 않습니다. 다인은 여전히 앞을 보지 못하고, 문을 두드린 사람은 방 안에 숨어 있을 수 있습니다. 다만 그 사람이 바뀝니다.\n문을 두드린 사람은 \"거기 카펫 남는 거 있어요? 저희 층에 한 장이 모자라서요.\"라고 물었고, 다인은 \"없어요. 미래 있는 층에 가 보세요.\"라고 답했습니다.\n이제 세영과 미래는 같은 층이니, 문을 두드린 사람은 태오입니다. 문을 두드린 사람이 범인이라는 논리에 따라, 이 사건의 범인은 문태오입니다."], ["사방이 열리지 않는 방에서, 다인은 어떻게 물에 빠져 죽었을까요?", "1층의 문을 전부 180도로 열면, 가운데에 방 하나 크기의 공간이 생깁니다. 범인은 다인을 그 안에 가뒀습니다. 문은 180도까지만 열리니, 사방 어디로도 더 밀 수 없습니다.\n물은 문태오 방문의 구멍으로 부었습니다. 이야기 카드에 구멍이 태오 방문의 오른쪽 아래 모서리에 있다고 나오니, 문을 180도로 열면 구멍이 화장실 문 앞에 옵니다. 범인은 호스를 수도꼭지에 연결해 그 구멍으로 물을 부었습니다.\n다만 구멍이 아래쪽에 있어서 그냥 부으면 물이 샙니다. 그래서 먼저 가운데 구역의 카펫을 천장에 붙이고, 다인을 복도 한가운데의 천장 쪽에 두었습니다. 그러면 물이 천장 쪽으로 흐릅니다.\n다인이 죽은 뒤에는 호스를 펌프에 연결해 물을 화장실로 퍼내 흘려보냈습니다. 시신과 젖은 카펫은 다인의 방으로 되돌렸습니다. 이번에도 젖는 것은 카펫 한 장뿐입니다."]], "C4": [["미래는 왜 세영을 찾아가다 창고에 들어갔고, 세영은 왜 미래를 찾다가 다인의 시신을 봤을까요?", "다인의 시신은 304, 미래의 방에 있습니다. 미래는 304에서 깨어나 그곳이 다인의 방인 줄 알고 세영을 찾아가려 했습니다.\n이번에는 한 층만 내려가 03호실로 가면 되는데, 그곳이 바로 203 창고입니다. 세영이 미래를 찾으러 가면, 미래의 방에서 다인의 시신을 보게 됩니다."], ["미래는 왜 사방이 열리지 않는 방에 있었고, 두 면의 유리 밖으로 반딧불이가 보였을까요?", "미래는 빈방에서 죽었습니다. 문이 열리지 않은 건, 범인이 자기 목소리를 그 방에 등록해 잠갔기 때문입니다.\n1막에 \"잠금은 전부 초기화 상태였고\", \"다들 자기 방에 자기 목소리를 등록했다\"는 대목이 나옵니다. 사람이 살지 않는 빈방은 여전히 초기화 상태라, 누구든 등록할 수 있다는 뜻입니다.\n또 \"방 하나에는 한 사람의 목소리만 잠금으로 등록할 수 있었다\"고 했지만, 이것이 한 사람의 목소리가 한 방에만 등록된다는 뜻은 아닙니다. 그러니 범인은 빈방 하나에 자기 목소리를 더 등록하면 됩니다.\n큐브관의 빈방 세 곳은 모두 쓸 수 있습니다. 204와 301은 방법이 같고, 403이라면 창이 세 면이라 한 단계가 더 필요합니다. 카펫을 천장에 놓거나, 옥상에서 천창을 덮어야 합니다."]]};

/* ---------- 해답 그림 (원본 해답 카드 그림을 한국어로 다시 그림) ---------- */
const DG = (function(){
  const L='rgba(201,214,242,.8)', F='rgba(8,16,36,.92)', T='#eef1f8', M='#98a5c6';
  let AC='#d8c53f';
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" fill="${o.c||T}" font-size="${o.s||14}" text-anchor="${o.a||'middle'}" font-weight="${o.w||700}" dominant-baseline="middle">${esc(s)}</text>`;
  const multi=(x,y,lines,o={})=>lines.map((l,i)=>txt(x,y+(i-(lines.length-1)/2)*(o.lh||(o.s||14)*1.25),l,o)).join('');
  const arrowHead=(x,y,ang,c=L,sz=7)=>{const a=ang*Math.PI/180;
    const p=[[x,y],[x-sz*Math.cos(a-.45),y-sz*Math.sin(a-.45)],[x-sz*Math.cos(a+.45),y-sz*Math.sin(a+.45)]];
    return `<polygon points="${p.map(q=>q.join(',')).join(' ')}" fill="${c}"/>`;};
  const line=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||L}" stroke-width="${o.w||1.6}" ${o.d?`stroke-dasharray="${o.d}"`:''}/>`+
    (o.head?arrowHead(x2,y2,Math.atan2(y2-y1,x2-x1)*180/Math.PI,o.c||L):'')+(o.tail?arrowHead(x1,y1,Math.atan2(y1-y2,x1-x2)*180/Math.PI,o.c||L):'');
  const curve=(x1,y1,cx,cy,x2,y2,o={})=>`<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" fill="none" stroke="${o.c||L}" stroke-width="${o.w||1.8}" ${o.d?`stroke-dasharray="${o.d}"`:''}/>`+
    (o.head?arrowHead(x2,y2,Math.atan2(y2-cy,x2-cx)*180/Math.PI,o.c||L):'')+(o.tail?arrowHead(x1,y1,Math.atan2(y1-cy,x1-cx)*180/Math.PI,o.c||L):'');
  /* 층 배치도: 3x3, 모서리 네 칸이 방 */
  function plan(x,y,s,floor,rooms,o={}){
    const c=s/3; let g=floor?txt(x+s/2,y-14,floor,{s:16}):'';
    g+=`<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="rgba(8,16,36,.55)" stroke="${L}" stroke-width="2"/>`;
    (o.hlCells||[]).forEach(([r,k])=>{g+=`<rect x="${x+k*c}" y="${y+r*c}" width="${c}" height="${c}" fill="${AC}" fill-opacity=".22"/>`;});
    (o.dashCells||[]).forEach(([r,k])=>{g+=`<rect x="${x+k*c+3}" y="${y+r*c+3}" width="${c-6}" height="${c-6}" fill="none" stroke="${L}" stroke-dasharray="4 4"/>`;});
    const pos={nw:[0,0],ne:[0,2],sw:[2,0],se:[2,2]};
    for(const k in rooms){ const [r,cc]=pos[k]; const hl=(o.hl||[]).includes(k);
      g+=`<rect x="${x+cc*c+3}" y="${y+r*c+3}" width="${c-6}" height="${c-6}" fill="${hl?AC:F}" fill-opacity="${hl?.16:1}" stroke="${hl?AC:L}" stroke-width="${hl?2.2:1.4}"/>`;
      const lines=String(rooms[k]).split('\n'); g+=multi(x+cc*c+c/2,y+r*c+c/2,lines,{s:o.fs||Math.max(12,c*.17)});
    }
    return g;
  }
  function cube(x,y,w,h,d,o={}){
    const dx=d*.75, dy=-d*.45;
    let g=`<polygon points="${x},${y} ${x+w},${y} ${x+w},${y+h} ${x},${y+h}" fill="rgba(10,14,30,.85)" stroke="${L}" stroke-width="1.6"/>`;
    g+=`<polygon points="${x},${y} ${x+dx},${y+dy} ${x+w+dx},${y+dy} ${x+w},${y}" fill="rgba(20,26,48,.9)" stroke="${L}" stroke-width="1.6"/>`;
    g+=`<polygon points="${x+w},${y} ${x+w+dx},${y+dy} ${x+w+dx},${y+h+dy} ${x+w},${y+h}" fill="rgba(14,19,38,.9)" stroke="${L}" stroke-width="1.6"/>`;
    if(o.inner){ g+=line(x+dx,y+dy,x+dx,y+h+dy,{d:'5 4'})+line(x+dx,y+h+dy,x,y+h,{d:'5 4'})+line(x+dx,y+h+dy,x+w+dx,y+h+dy,{d:'5 4'}); }
    return g;
  }
  const north=(x,y,ang=-20)=>{const a=ang*Math.PI/180, x2=x+34*Math.cos(a), y2=y+34*Math.sin(a);
    return line(x,y,x2,y2,{head:true,w:1.4})+txt(x-12,y+2,'북',{s:13});};
  const person=(x,y,c=T)=>`<circle cx="${x}" cy="${y-9}" r="4.5" fill="${c}"/><rect x="${x-4}" y="${y-4}" width="8" height="15" rx="3" fill="${c}"/>`;
  const lamp=(x,y)=>`<rect x="${x}" y="${y}" width="16" height="16" fill="#ffe9a8"/><rect x="${x-10}" y="${y-10}" width="36" height="36" fill="#ffe9a8" opacity=".15"/>`;

const ROUND={A:["첫 번째 해답","#d8c53f"],B:["두 번째 해답","#6f9be8"],C:["세 번째 해답","#d0645a"]};
/* 해설 글: 문단은 원고의 줄바꿈 그대로, 화면에 맞춰 여러 장으로 나눔 */
function toParagraphs(text){ return text.split(/\n+/).map(t=>t.trim()).filter(Boolean); }
const NAMES=["박다인","김유진","김세영","김미래","한도경","문태오","다인","유진","세영","미래","도경","태오"];
const NAME_RE=new RegExp("("+NAMES.join("|")+")","g");
function markup(t){
  let h=t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  h=h.replace(/"([^"]+)"/g,"<q>$1</q>");
  h=h.replace(NAME_RE,"<b>$1</b>");
  h=h.replace(/(^|[^\d])([1-4]0[1-4]|0[1-4]호실)(?!\d)/g,"$1<b>$2</b>");
  return h;
}
let ansPages=[], ansPage=0, ansScene=null;
function showAnswer(s, atEnd){
  const [rname,acc]=ROUND[s.answer[0]]; const box=document.getElementById("ans");
  box.style.setProperty("--acc",acc);
  const t=s.case.replace(/^「|」$/g,"");
  document.getElementById("aTitle").textContent=t;
  document.getElementById("aBadge").textContent=s.answer;
  document.getElementById("aRound").textContent=rname;
  document.getElementById("aCase").textContent=t;
  document.getElementById("aPart").textContent=`${s.part+1} / ${s.parts}`; document.getElementById("aPartBox").hidden=s.parts<2;
  document.getElementById("aFig").innerHTML=DG.draw(s.answer,acc);
  ansScene=s; paginateAnswer(); ansPage = atEnd ? ansPages.length-1 : 0; renderAnswerPage();
}
function setQ(show){
  const s=ansScene, q=ANSWERS[s.answer][s.part][0], qe=document.getElementById("aQ");
  if(!(show&&q)){ qe.style.display="none"; return; }
  qe.style.display="";
  document.getElementById("aQn").textContent=s.parts>1?`수수께끼 ${s.part+1}`:"수수께끼";
  document.getElementById("aQt").textContent=q;
}
function setPg(n,i){ const pg=document.getElementById("aPg"); pg.hidden=n<2;
  pg.innerHTML=Array.from({length:Math.max(n,1)},(_,k)=>`<i class="${k===i?"on":""}"></i>`).join(""); }
function paginateAnswer(){
  const s=ansScene, tx=document.getElementById("aTx"), ae=document.getElementById("aA");
  const paras=toParagraphs(ANSWERS[s.answer][s.part][1]);
  ansPages=[]; let page=[], first=true;
  const setup=(withQ)=>{ setQ(withQ); ae.innerHTML=""; setPg(2,0); };
  setup(true);
  const fits=()=>tx.scrollHeight<=tx.clientHeight+1;
  const queue=[...paras];
  while(queue.length){
    const p=queue.shift(); const el=document.createElement("p"); el.innerHTML=markup(p); ae.appendChild(el);
    if(fits()){ page.push(p); continue; }
    ae.removeChild(el);
    if(page.length===0){   /* 문단 하나가 한 장보다 길면 문장 단위로 쪼갬 */
      const parts=p.match(/[^.?!]+[.?!]+["”」』)]*\s*|[^.?!]+$/g)||[p];
      if(parts.length>1){ const half=Math.ceil(parts.length/2); queue.unshift(parts.slice(half).join(" ").trim()); queue.unshift(parts.slice(0,half).join(" ").trim()); continue; }
      page.push(p); }
    else queue.unshift(p);
    ansPages.push({q:first,paras:page}); first=false; page=[]; setup(false);
  }
  if(page.length) ansPages.push({q:first,paras:page});
}
function renderAnswerPage(){
  const pg=ansPages[ansPage], ae=document.getElementById("aA");
  setQ(pg.q);
  ae.innerHTML=""; pg.paras.forEach(p=>{ const el=document.createElement("p"); el.innerHTML=markup(p); ae.appendChild(el); });
  setPg(ansPages.length,ansPage);
}
function answerStep(dir){
  if(!(cur>=0 && SCENES[cur].answer)) return false;
  const nx=ansPage+dir; if(nx<0||nx>=ansPages.length) return false;
  ansPage=nx; const ae=document.getElementById("aA"); ae.style.opacity=0;
  setTimeout(()=>{ renderAnswerPage(); ae.style.opacity=1; },200); return true;
}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(cur>=0&&SCENES[cur].answer){ paginateAnswer(); ansPage=Math.min(ansPage,ansPages.length-1); renderAnswerPage(); } });
addEventListener("resize",()=>{ if(cur>=0&&SCENES[cur].answer){ paginateAnswer(); ansPage=Math.min(ansPage,ansPages.length-1); renderAnswerPage(); } });

const NB = new Audio("bgm/news_bgm.mp3"); NB.preload="auto"; NB.loop=false; NB.volume=0;
const NB_LOUD=.85, NB_UNDER=.13, NEWS_INTRO=3.0;   /* 배경음악만 나오는 시간(초) */
let VOICE_END=CAPTIONS[CAPTIONS.length-1][1];
let newsT0=0, newsTimer=null, newsVoice=null, nbRaf=null;
function nbTarget(nt){            /* nt: 뉴스 장면 시작 후 지난 시간 */
  const vt=nt-NEWS_INTRO;         /* 나레이션 시간 */
  if(nt < NEWS_INTRO-0.7) return NB_LOUD;
  if(vt < 0)               return NB_LOUD + (NB_UNDER-NB_LOUD)*((nt-(NEWS_INTRO-0.7))/0.7);
  if(vt < VOICE_END)       return NB_UNDER;
  if(vt < VOICE_END+2.5)   return NB_UNDER + (.5-NB_UNDER)*((vt-VOICE_END)/2.5);
  if(vt < VOICE_END+7)     return .5*(1-(vt-VOICE_END-2.5)/4.5);
  return 0;
}
function nbLoop(){
  if(!newsVoice){ nbRaf=null; return; }
  const nt=(performance.now()-newsT0)/1000;
  NB.volume=Math.max(0,Math.min(1,nbTarget(nt)));
  if(nt-NEWS_INTRO>VOICE_END+7){ NB.pause(); nbRaf=null; return; }
  nbRaf=requestAnimationFrame(nbLoop);
}
function newsStart(voice){
  newsVoice=voice; newsT0=performance.now();
  NB.currentTime=0; NB.volume=NB_LOUD; NB.play().catch(()=>{});
  if(!nbRaf) nbRaf=requestAnimationFrame(nbLoop);
  clearTimeout(newsTimer);

    voice.currentTime=0; voice.volume=VOL;
    voice.play().catch(()=>toast("뉴스 파일(bgm/news.mp3)을 재생하지 못했습니다."));
  }, NEWS_INTRO*1000);
}
function newsStop(){
  clearTimeout(newsTimer); newsVoice=null; if(nbRaf){cancelAnimationFrame(nbRaf); nbRaf=null;}

}

  for(let j=0;j<CAPTIONS.length;j++){
    const nextStart = j+1<CAPTIONS.length ? CAPTIONS[j+1][0] : Infinity;
    const end = (nextStart-CAPTIONS[j][1] < 1.0) ? nextStart : CAPTIONS[j][1];
    if(t>=CAPTIONS[j][0]&&t<end) k=j;
  }
  if(k===capIdx) return; capIdx=k;
  const c=document.getElementById("nCap");
  if(k<0){ c.classList.add("off"); return; }
  c.textContent=CAPTIONS[k][2]; c.classList.remove("off");
}

function setHeadline(k,instant){
  if(k===hlIdx) return; hlIdx=k; const [_,tag,text]=HEADLINES[k];

/* ---------- 두 플레이어로 교차 재생 ---------- */
const A=[new Audio(),new Audio()]; A.forEach(a=>{a.loop=true;a.preload="auto";a.volume=0;});
let front=0, cur=-1, started=false;
const pre=new Audio(); pre.preload="auto"; pre.muted=true;
const FADE=2600, VOL=1;
function ramp(a,to,ms,done){
  const from=a.volume, t0=performance.now();
  if(a._raf) cancelAnimationFrame(a._raf);
  const step=t=>{const k=Math.min(1,(t-t0)/ms); a.volume=Math.max(0,Math.min(1,from+(to-from)*k));
    if(k<1) a._raf=requestAnimationFrame(step); else {a._raf=null; done&&done();}};
  a._raf=requestAnimationFrame(step);
}
function playTrack(key){
  const old=A[front];
  ramp(old,0,FADE,()=>old.pause());
  if(!key) return;
  front=1-front; const a=A[front];
  if(a._key!==key){ a.src=src(key); a._key=key; }
  a.loop = key!=="news";
  a.ontimeupdate = key==="news" ? ()=>{ syncHeadline(a); syncCaption(a); } : null;
  a.currentTime=0; a.volume=0;
  if(key==="news"){ capIdx=-2; a.pause(); newsStart(a); return; }
  a.play().then(()=>ramp(a,VOL,FADE)).catch(()=>toast("음악을 재생하지 못했습니다. 화면을 한 번 더 눌러주세요."));
}

const $=id=>document.getElementById(id);
const tw=$("titleWrap"), stage=$("stage");
function go(i,atEnd){
  if(i<0||i>=SCENES.length||i===cur) return;
  cur=i; const s=SCENES[i];
  tw.classList.add("out");
  if(!s.answer) setTimeout(()=>{ $("sceneNum").textContent=s.num; $("sceneTitle").textContent=s.title; $("sceneSub").textContent=s.sub;
    tw.classList.remove("out"); }, 900);
  stage.classList.toggle("dim",!!s.dim);
  stage.classList.toggle("poster",!!s.poster);
  stage.classList.toggle("answer",!!s.answer);
  if(s.answer) showAnswer(s,atEnd);
  if(stage.classList.contains("news") && !s.news) newsStop();
  if(stage.classList.contains("letter") && !s.letter) lStop();
  stage.classList.toggle("letter",!!s.letter);
  if(s.letter) setTimeout(()=>{ if(SCENES[cur]&&SCENES[cur].letter) lStart(); }, 1200);
  stage.classList.toggle("news",!!s.news);
  if(s.news) setHeadline(0,true);
  const live=A[front];
  if(!(s.track && live._key===s.track && !live.paused && s.track!=="news")) playTrack(s.track);
  // 다음 곡 미리 받아두기 (재생 중인 플레이어는 건드리지 않음)
  const n=SCENES[i+1]; if(n&&n.track&&n.track!=="news"){ pre.src=src(n.track); pre.load(); }
}

let last=0;
function tap(dir,el){
  const now=Date.now(); if(now-last<700) return; last=now;   // 두 번 눌림 방지
  keepAwake();
  if(!started){ started=true; $("start").classList.add("gone"); go(0); return; }
  el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),60);
  if(answerStep(dir)) return;
  if(dir>0){ if(cur>=SCENES.length-1) null; else go(cur+1); }
  else     { if(cur<=0) null; else go(cur-1,true); }
}
$("zNext").addEventListener("click",e=>tap(1,e.currentTarget));
$("zPrev").addEventListener("click",e=>tap(-1,e.currentTarget));
addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); tap(-1,$("zPrev")); }
});

$("bFull").addEventListener("click",async e=>{

let lock=null;
async function keepAwake(){
  if(lock||!("wakeLock" in navigator)) return;
  try{ lock=await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>{lock=null;}); }catch(e){}
}

  };
  const onTap=e=>{
    e.stopImmediatePropagation(); e.preventDefault();
    if(k>=CAPTIONS.length) return;

  const target = lmFadeOut ? 0 : (LV.ended ? .5 : (!started ? .45 : (speaking ? .3 : .45)));
  lmLevel += (target-lmLevel)*(lmFadeOut?0.012:0.05);
  LMS.forEach(a=>{ if(!a.paused){ a.volume=Math.max(0,Math.min(1,lmLevel)); if(lmFadeOut&&lmLevel<0.01) a.pause(); } });
}
LV.addEventListener("ended",()=>{ if(lOn) setTimeout(()=>{ if(!lOn) return;
  document.getElementById("endcard").classList.add("on"); }, 5000); });   /* 제목 화면에서도 음악은 계속 이어짐 (맺음말 배경) */

/* ---------- 음원을 못 불러오면 어떤 파일인지 알려줌 ---------- */
function watchAudio(a){ a.addEventListener("error",()=>{ const f=(a.currentSrc||a.src||"").split("/").slice(-2).join("/");
  toast("음원을 불러오지 못했습니다: "+decodeURIComponent(f)+" — 파일 이름과 bgm 폴더 위치를 확인해 주세요."); }); }
[...A, NB, LV, ...LMS].forEach(watchAudio);
/* ---------- 반딧불이 ---------- */
(function(){
  const c=$("flies"), x=c.getContext("2d"); let W,H,dpr; const F=[];
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){dpr=Math.min(2,devicePixelRatio||1); W=c.width=innerWidth*dpr; H=c.height=innerHeight*dpr;}
  size(); addEventListener("resize",size);
  for(let i=0;i<26;i++) F.push({x:Math.random(),y:.35+Math.random()*.65,r:1+Math.random()*2.2,
    vx:(Math.random()-.5)*.00012,vy:-(.00005+Math.random()*.00012),p:Math.random()*6.28,s:.4+Math.random()*.9});
  function draw(t){
    x.clearRect(0,0,W,H);
    for(const f of F){
      if(!still){ f.x+=f.vx+Math.sin(t/4000+f.p)*.00006; f.y+=f.vy; if(f.y<-.02){f.y=1.02;f.x=Math.random();} }
      const a=.25+.55*(.5+.5*Math.sin(t/900*f.s+f.p)), px=f.x*W, py=f.y*H, r=f.r*dpr;
      const g=x.createRadialGradient(px,py,0,px,py,r*7); g.addColorStop(0,`rgba(232,212,80,${a})`); g.addColorStop(1,"rgba(232,212,80,0)");
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r*7,0,6.283); x.fill();
    }
    if(!still) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
